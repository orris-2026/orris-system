<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#240062">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="ORRIS">
<title>ORRIS — النظام الداخلي</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%23240062'/%3E%3Ccircle cx='32' cy='32' r='19' fill='none' stroke='%23fff' stroke-width='5'/%3E%3Ccircle cx='32' cy='35' r='13' fill='none' stroke='%23fff' stroke-width='2.5'/%3E%3Ccircle cx='32' cy='39' r='8' fill='none' stroke='%23fff' stroke-width='1.6'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --deep:#240062; --bg:#130838; --bg2:#1A0C4E; --card:#1F1160; --card2:#27176F; --field:#170A47;
  --line:rgba(170,150,255,.16); --line2:rgba(170,150,255,.28);
  --text:#F4F1FF; --muted:#B0A7DA; --faint:#7E74AE;
  --violet:#6A2BFF; --violet2:#5B10F0; --mint:#45E0A5; --orange:#FF6B1A; --pink:#F0208C; --sky:#3CB8F0;
  --ok:#45E0A5; --warn:#FFB020; --bad:#FF4D6D;
  --r:14px; --ar:"Thmanyah Sans","Thmanyah","IBM Plex Sans Arabic",Tahoma,sans-serif; --en:"Barlow Condensed","Thmanyah Sans","IBM Plex Sans Arabic",sans-serif;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;min-height:100%}
body{font-family:var(--ar);background:var(--bg);color:var(--text);font-size:14px;line-height:1.6}
button,input,select,textarea{font-family:inherit;font-size:14px;color:inherit}
button{cursor:pointer}
a{color:inherit;text-decoration:none}
.n{font-family:var(--en);font-weight:600;letter-spacing:.3px;direction:ltr;unicode-bidi:isolate;display:inline-block}
.muted{color:var(--muted)} .faint{color:var(--faint)}
.hide{display:none!important}

/* ===== top bar ===== */
.top{position:sticky;top:0;z-index:40;height:56px;display:flex;align-items:center;gap:6px;padding:0 12px;background:rgba(19,8,56,.92);backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.top.home-top{background:transparent;border-color:transparent;backdrop-filter:none;position:absolute;inset-inline:0}
.ibtn{position:relative;width:38px;height:38px;border-radius:10px;border:0;background:transparent;color:var(--text);display:grid;place-items:center;flex:none}
.ibtn:hover{background:rgb(var(--wrgb) / .08)}
.ibtn svg{width:20px;height:20px}
.ibtn .cnt{position:absolute;top:2px;inset-inline-end:0;min-width:18px;height:18px;padding:0 5px;border-radius:9px;background:var(--pink);color:#fff;font:600 11px/18px var(--en);text-align:center}
.logo{height:26px;display:block}
.appname{font-weight:700;font-size:16px;white-space:nowrap;margin-inline-start:4px}
.menu{display:flex;gap:2px;overflow-x:auto;scrollbar-width:none;margin-inline-start:10px}
.menu::-webkit-scrollbar{display:none}
.menu a{padding:7px 12px;border-radius:9px;color:var(--muted);white-space:nowrap;font-size:13.5px}
.menu a:hover{color:var(--text);background:rgb(var(--wrgb) / .06)}
.menu a.on{color:var(--text);background:rgba(106,43,255,.28);font-weight:600}
.sp{flex:1}
.cmp{font-size:13px;color:var(--muted);white-space:nowrap}
.av{width:34px;height:34px;border-radius:50%;background:linear-gradient(135deg,var(--violet),var(--pink));display:grid;place-items:center;font-weight:700;border:2px solid rgb(var(--wrgb) / .25);cursor:pointer;flex:none}
.burger{display:none}
.drop{position:absolute;top:58px;inset-inline-end:10px;width:330px;max-width:calc(100vw - 20px);background:var(--card);border:1px solid var(--line2);border-radius:var(--r);box-shadow:0 20px 50px rgba(0,0,0,.45);display:none;z-index:60;overflow:hidden}
.drop.open{display:block}
.drop h4{margin:0;padding:12px 14px;border-bottom:1px solid var(--line);font-size:14px;display:flex;justify-content:space-between}
.drop .it{padding:10px 14px;border-bottom:1px solid var(--line);display:flex;gap:10px;font-size:13px;cursor:pointer}
.drop .it:hover{background:rgb(var(--wrgb) / .04)}
.drop .it:last-child{border-bottom:0}
.dotc{width:8px;height:8px;border-radius:50%;margin-top:8px;flex:none}
.drop small{display:block;color:var(--muted)}
.roles .it.on{background:rgba(106,43,255,.2)}

/* drawer (mobile menus) */
.drawer-bg{position:fixed;inset:0;background:rgba(5,0,20,.6);z-index:70;display:none}
.drawer-bg.open{display:block}
.drawer{position:fixed;top:0;bottom:0;inset-inline-start:0;width:270px;background:var(--bg2);border-inline-end:1px solid var(--line2);z-index:71;transform:translateX(100%);transition:.2s;padding:16px;display:flex;flex-direction:column;gap:4px}
.drawer.open{transform:none}
.drawer a{padding:11px 12px;border-radius:10px;color:var(--muted)}
.drawer a.on{background:rgba(106,43,255,.28);color:var(--text);font-weight:600}

/* ===== home ===== */
.home{min-height:100vh;padding:90px 16px 50px;position:relative;overflow:hidden;
  background:radial-gradient(900px 520px at 50% 118%, rgba(91,16,240,.75), transparent 70%),
             radial-gradient(500px 360px at 0% 100%, rgba(255,107,26,.35), transparent 70%),
             linear-gradient(180deg,#1A0050 0%,#240062 100%)}
.home:before{content:"";position:absolute;inset:0;pointer-events:none;opacity:.35;
  background-image:radial-gradient(circle at 50% 100%, rgba(106,43,255,.55) 0 34px, transparent 35px);
  background-size:110px 70px;mask-image:linear-gradient(180deg,transparent 0%,#000 60%,transparent 100%)}
.home-in{position:relative;max-width:820px;margin:0 auto}
.hello{text-align:center;margin-bottom:28px}
.hello h1{margin:0;font-size:24px}
.hello p{margin:2px 0 0;color:var(--muted)}
.wait{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin-bottom:34px}
.wchip{display:flex;align-items:center;gap:8px;background:rgb(var(--wrgb) / .07);border:1px solid var(--line2);border-radius:30px;padding:6px 14px 6px 8px;font-size:13px;cursor:pointer}
.wchip:hover{background:rgb(var(--wrgb) / .12)}
.wchip b{min-width:24px;height:24px;border-radius:12px;background:var(--mint);color:var(--deep);display:grid;place-items:center;font:700 13px var(--en);padding:0 6px}
.apps{display:grid;grid-template-columns:repeat(var(--cols,5),1fr);gap:28px 14px;justify-items:center}
.app{display:flex;flex-direction:column;align-items:center;gap:10px;width:120px;text-align:center}
.tile{position:relative;width:88px;height:88px;border-radius:22px;background:#fff;display:grid;place-items:center;box-shadow:0 10px 26px rgba(0,0,0,.35);transition:.18s}
.app:hover .tile{transform:translateY(-4px);box-shadow:0 16px 34px rgba(91,16,240,.55)}
.tile svg{width:48px;height:48px}
.tile .cnt{position:absolute;top:-7px;inset-inline-end:-7px;min-width:24px;height:24px;border-radius:12px;background:var(--pink);color:#fff;font:700 13px/24px var(--en);padding:0 6px;border:2px solid #240062}
.app span{font-size:14px;font-weight:500}
.hint{margin-top:44px;text-align:center;color:var(--muted);font-size:12.5px}

/* ===== page / control panel ===== */
.page{max-width:1240px;margin:0 auto;padding:16px 16px 70px}
.cp{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:14px}
.crumb{font-size:18px;font-weight:700;display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.crumb a{color:var(--muted);font-weight:500}
.crumb .sep{color:var(--faint)}
.search{display:flex;align-items:center;gap:6px;background:var(--field);border:1px solid var(--line2);border-radius:10px;padding:0 6px 0 10px;min-width:260px;flex:1;max-width:460px;position:relative}
.search input{flex:1;border:0;background:transparent;outline:0;padding:8px 4px;min-width:0}
.search .chip{background:rgba(106,43,255,.3);border-radius:6px;padding:1px 8px;font-size:12px;white-space:nowrap;cursor:pointer}
.fdrop{position:absolute;top:44px;inset-inline-start:0;width:300px;background:var(--card);border:1px solid var(--line2);border-radius:12px;box-shadow:0 18px 40px rgba(0,0,0,.45);padding:10px;display:none;z-index:30;grid-template-columns:1fr 1fr;gap:6px}
.fdrop.open{display:grid}
.fdrop h6{margin:2px 0 4px;font-size:12px;color:var(--muted)}
.fdrop button{display:block;width:100%;text-align:start;background:transparent;border:0;padding:6px 8px;border-radius:7px;font-size:13px}
.fdrop button:hover{background:rgb(var(--wrgb) / .06)}
.fdrop button.on{color:var(--mint);font-weight:600}
.vsw{display:flex;border:1px solid var(--line2);border-radius:10px;overflow:hidden}
.vsw button{border:0;background:transparent;padding:7px 10px;color:var(--muted)}
.vsw button.on{background:rgba(106,43,255,.35);color:var(--text)}
.btn{border:1px solid var(--line2);background:rgb(var(--wrgb) / .04);color:var(--text);border-radius:10px;padding:8px 15px;font-weight:600;white-space:nowrap}
.btn:hover{border-color:var(--violet)}
.btn.pri{background:var(--violet2);border-color:var(--violet2)}
.btn.pri:hover{background:var(--violet)}
.btn.mint{background:var(--mint);border-color:var(--mint);color:var(--deep)}
.btn.ghost{background:transparent}
.btn.bad{color:var(--bad);border-color:rgba(255,77,109,.4)}
.btn.sm{padding:5px 11px;font-size:12.5px}
.btn[disabled]{opacity:.38;cursor:not-allowed}

/* cards & kpis */
.card{background:linear-gradient(180deg,var(--card),var(--bg2));border:1px solid var(--line);border-radius:var(--r);padding:16px}
.grid{display:grid;gap:14px}
.k4{grid-template-columns:repeat(auto-fit,minmax(170px,1fr))}
.k3{grid-template-columns:repeat(auto-fit,minmax(260px,1fr))}
.kpi{position:relative;overflow:hidden}
.kpi:after{content:"";position:absolute;inset-block:12px;inset-inline-start:0;width:3px;border-radius:3px;background:var(--c,var(--violet));box-shadow:0 0 14px var(--c,var(--violet))}
.kpi small{color:var(--muted);font-size:12.5px;display:block}
.kpi b{font:700 28px/1.2 var(--en);display:block;margin-top:4px;direction:ltr;text-align:right}
.kpi em{font-style:normal;font-size:12px;color:var(--muted)}
.sar{font-family:var(--ar);font-size:13px;font-weight:500;color:var(--muted);margin-inline-start:4px}
.bar{height:8px;background:rgb(var(--wrgb) / .08);border-radius:6px;overflow:hidden}
.bar i{display:block;height:100%;border-radius:6px;background:var(--c,var(--mint));box-shadow:0 0 10px var(--c,var(--mint))}

/* tables */
.tbl{border:1px solid var(--line);border-radius:var(--r);overflow-x:auto;background:var(--bg2)}
table{width:100%;border-collapse:collapse}
th,td{padding:11px 13px;text-align:right;border-bottom:1px solid var(--line);vertical-align:middle}
th{font-size:12.5px;color:var(--muted);font-weight:600;background:rgb(var(--wrgb) / .02);white-space:nowrap}
tr:last-child td{border-bottom:0}
tbody tr.go{cursor:pointer}
tbody tr.go:hover td{background:rgba(106,43,255,.08)}
tr.grp td{background:rgb(var(--wrgb) / .03);font-weight:600;color:var(--mint)}
.pill{display:inline-flex;align-items:center;gap:6px;padding:2px 11px;border-radius:20px;font-size:12px;font-weight:600;white-space:nowrap;border:1px solid}
.pill:before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor}
.s-draft{color:#B0A7DA;border-color:rgba(176,167,218,.35)}
.s-wait{color:var(--warn);border-color:rgba(255,176,32,.4)}
.s-ok{color:var(--mint);border-color:rgba(69,224,165,.4)}
.s-info{color:var(--sky);border-color:rgba(60,184,240,.4)}
.s-bad{color:var(--bad);border-color:rgba(255,77,109,.45)}
.s-done{color:#fff;border-color:rgb(var(--wrgb) / .35)}

/* kanban */
.kan{display:grid;grid-template-columns:repeat(auto-fill,minmax(270px,1fr));gap:14px}
.kc{cursor:pointer;transition:.15s}
.kc:hover{border-color:var(--violet);transform:translateY(-2px)}
.kc h3{margin:0;font-size:16px}
.kc .row{display:flex;justify-content:space-between;align-items:center;gap:8px;font-size:12.5px;color:var(--muted);margin:10px 0 5px}

/* form view */
.fhead{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;background:var(--bg2);border:1px solid var(--line);border-radius:var(--r);padding:10px 12px;margin-bottom:12px}
.acts{display:flex;gap:8px;flex-wrap:wrap}
.stbar{display:flex;flex-wrap:wrap}
.stbar span{position:relative;padding:6px 14px 6px 18px;font-size:12.5px;color:var(--faint);background:rgb(var(--wrgb) / .03);border:1px solid var(--line);margin-inline-start:-1px;white-space:nowrap}
.stbar span:first-child{border-radius:0 9px 9px 0}
.stbar span:last-child{border-radius:9px 0 0 9px}
.stbar span.done{color:var(--muted)}
.stbar span.cur{background:rgba(106,43,255,.4);border-color:var(--violet);color:#fff;font-weight:600}
.fwrap{display:grid;grid-template-columns:minmax(0,1fr) 330px;gap:14px;align-items:start}
.sheet{min-width:0;background:var(--bg2);border:1px solid var(--line);border-radius:var(--r);padding:18px}
.sheet h2{margin:0 0 4px;font-size:22px}
.smart{display:flex;flex-wrap:wrap;gap:8px;margin:14px 0}
.sb{display:flex;align-items:center;gap:9px;border:1px solid var(--line2);background:rgb(var(--wrgb) / .03);border-radius:11px;padding:7px 12px;cursor:pointer;min-width:126px}
.sb:hover{border-color:var(--mint)}
.sb b{font:700 18px var(--en);display:block;line-height:1}
.sb small{color:var(--muted);font-size:12px}
.sb svg{width:20px;height:20px;color:var(--mint);flex:none}
.tabs{display:flex;gap:2px;border-bottom:1px solid var(--line);margin:16px 0 14px;overflow-x:auto;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tabs button{border:0;background:transparent;padding:9px 14px;color:var(--muted);border-bottom:2px solid transparent;white-space:nowrap}
.tabs button.on{color:var(--text);border-color:var(--mint);font-weight:600}
.lock{font-size:12px;color:var(--faint);margin-inline-start:6px}
.chatter{background:var(--bg2);border:1px solid var(--line);border-radius:var(--r);padding:14px;position:sticky;top:70px;max-height:calc(100vh - 90px);overflow:auto}
.chatter h4{margin:0 0 10px;font-size:14px;display:flex;justify-content:space-between}
.msg{display:flex;gap:9px;margin-bottom:12px;font-size:13px}
.msg .av{width:28px;height:28px;font-size:12px;border-width:0;cursor:default}
.msg small{color:var(--faint);display:block;font-size:11.5px}
.note-in{display:flex;gap:6px;margin-bottom:12px}
.note-in input{flex:1;background:var(--field);border:1px solid var(--line2);border-radius:9px;padding:7px 10px;outline:0}
.fields{display:grid;grid-template-columns:1fr 1fr;gap:6px 22px}
.fl{display:flex;gap:10px;padding:6px 0;border-bottom:1px dashed var(--line);font-size:13.5px}
.fl label{color:var(--muted);min-width:120px}

/* forms */
.f{display:flex;flex-direction:column;gap:5px;margin-bottom:12px}
.f label{font-size:12.5px;color:var(--muted);font-weight:600}
.f input,.f select,.f textarea{background:var(--field);border:1px solid var(--line2);border-radius:10px;padding:9px 11px;outline:0;width:100%}
.f input:focus,.f select:focus{border-color:var(--violet);box-shadow:0 0 0 3px rgba(106,43,255,.25)}
.f input.auto{border-color:rgba(69,224,165,.55);background:rgba(69,224,165,.07)}
.two{display:grid;grid-template-columns:1fr 1fr;gap:0 12px}
.req{color:var(--pink)}
.slot{border:1.5px dashed var(--line2);border-radius:12px;padding:12px;display:flex;align-items:center;gap:10px;margin-bottom:10px;background:rgb(var(--wrgb) / .02)}
.slot.ok{border-style:solid;border-color:rgba(69,224,165,.5);background:rgba(69,224,165,.06)}
.slot .ic{width:36px;height:36px;border-radius:10px;background:rgba(106,43,255,.25);display:grid;place-items:center;flex:none}
.slot.ok .ic{background:rgba(69,224,165,.2)}
.slot div{flex:1;min-width:0}
.slot small{display:block;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.upl{display:inline-flex;align-items:center;gap:6px;cursor:pointer}
.upl input{display:none}
.alert{border-radius:11px;padding:10px 13px;font-size:13px;border:1px solid}
.alert.warn{background:rgba(255,176,32,.08);border-color:rgba(255,176,32,.35);color:#FFD27A}
.alert.info{background:rgba(60,184,240,.08);border-color:rgba(60,184,240,.35);color:#9CDDFB}
.alert.ok{background:rgba(69,224,165,.08);border-color:rgba(69,224,165,.35);color:#9CF0CF}
.alert.bad{background:rgba(255,77,109,.08);border-color:rgba(255,77,109,.4);color:#FFA3B4}
.cin{width:96px;background:var(--field);border:1px solid var(--line2);border-radius:8px;padding:5px 7px;outline:0}
.cin.warn{border-color:var(--warn)}
select.cin{width:auto;max-width:220px}

/* modal */
.mbg{position:fixed;inset:0;background:rgba(5,0,20,.7);display:none;align-items:flex-start;justify-content:center;padding:36px 12px;z-index:80;overflow:auto}
.mbg.open{display:flex}
.modal{background:var(--bg2);border:1px solid var(--line2);border-radius:16px;width:720px;max-width:100%;box-shadow:0 30px 70px rgba(0,0,0,.6)}
.modal.wide{width:1040px}
.modal header{padding:14px 18px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center;gap:10px}
.modal header h3{margin:0;font-size:16px}
.modal .body{padding:16px 18px}
.modal footer{padding:12px 18px;border-top:1px solid var(--line);display:flex;gap:8px;flex-wrap:wrap}
.x{border:0;background:transparent;color:var(--muted);font-size:22px;line-height:1}
.toast{position:fixed;bottom:22px;left:50%;transform:translate(-50%,20px);background:var(--card2);border:1px solid var(--mint);color:var(--text);padding:10px 16px;border-radius:12px;opacity:0;transition:.25s;z-index:90;font-size:13.5px;max-width:92vw;box-shadow:0 0 24px rgba(69,224,165,.25)}
.toast.show{opacity:1;transform:translate(-50%,0)}
.spin{display:inline-block;width:15px;height:15px;border:2px solid rgb(var(--wrgb) / .25);border-top-color:var(--mint);border-radius:50%;animation:sp .8s linear infinite;vertical-align:-3px}
@keyframes sp{to{transform:rotate(360deg)}}
.empty{padding:26px;text-align:center;color:var(--muted)}
.split{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:14px}
.prev{background:#fff;border-radius:12px;min-height:340px;display:grid;place-items:center;overflow:hidden;color:#240062}
.prev img,.prev iframe{width:100%;height:440px;object-fit:contain;border:0;display:block}
.line-row.sel td{background:rgba(106,43,255,.14)}
.je{font-family:var(--en);font-size:14px}
.je td,.je th{padding:7px 10px}
.hbars .r{display:grid;grid-template-columns:130px 1fr 150px;gap:12px;align-items:center;margin-bottom:12px;font-size:13px}
.hbars .t{height:14px;background:rgb(var(--wrgb) / .07);border-radius:7px;overflow:hidden}
.hbars .t i{display:block;height:100%;border-radius:7px}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:12px;color:var(--muted)}
.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-inline-end:5px;vertical-align:-1px}
.stack{display:flex;height:10px;border-radius:6px;overflow:hidden;background:rgb(var(--wrgb) / .07)}
.stack i{display:block;height:100%}

/* portal */
.portal{min-height:100vh;background:linear-gradient(180deg,#1A0050,#130838 340px)}
.ptop{display:flex;align-items:center;gap:12px;padding:14px 18px;border-bottom:1px solid var(--line)}
.phero{max-width:1100px;margin:0 auto;padding:26px 16px 6px}
.phero h1{margin:0;font-size:24px}
.badge-demo{position:fixed;bottom:10px;inset-inline-end:10px;opacity:.85;pointer-events:none;z-index:50;background:var(--orange);color:#fff;border-radius:20px;padding:4px 12px;font-size:12px;font-weight:600}

#finWrap{position:fixed;top:56px;left:0;right:0;bottom:0;z-index:5;background:var(--bg)}
#finWrap iframe{width:100%;height:100%;border:0;display:block}
#tip{position:fixed;z-index:95;pointer-events:none;background:#0B0428;border:1px solid var(--line2);color:var(--text);font-size:12.5px;padding:6px 10px;border-radius:8px;opacity:0;transition:opacity .12s;max-width:280px}
.ch{margin:0 0 6px;font-size:14.5px}.ch2{margin:4px 0 8px;font-size:12.5px;color:var(--muted);font-weight:600}
.hb{display:flex;flex-direction:column;gap:8px}
.hbr{display:grid;grid-template-columns:minmax(80px,34%) minmax(60px,1fr) 64px;gap:8px;align-items:center;font-size:12.5px}
.hbl{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hbt{position:relative;height:10px;background:rgb(var(--wrgb) / .06);border-radius:5px}
.hbt i{position:absolute;top:0;bottom:0;border-radius:4px}
.hbt i.mid{left:50%;width:1px;background:rgb(var(--wrgb) / .35);border-radius:0}
.hbv{text-align:left;font-size:12.5px}
/* ===== responsive ===== */
@media (max-width:900px){
  .fwrap{grid-template-columns:minmax(0,1fr)}
  .chatter{position:static;max-height:none}
  .apps{grid-template-columns:repeat(3,1fr)!important}
}
@media (max-width:760px){
  .menu{display:none}
  .burger{display:grid}
  .cmp{display:none}
  .top .logo{height:20px}
  .appname{font-size:15px}
  .search{min-width:0;max-width:none;order:3;flex-basis:100%}
  .two,.fields,.split{grid-template-columns:minmax(0,1fr)}
  .top .logo.inner{display:none}
  .top{gap:2px;padding:0 6px}
  .apps{gap:24px 4px}
  .app{width:100%}
  .tile{width:74px;height:74px;border-radius:19px}
  .tile svg{width:40px;height:40px}
  .hbars .r{grid-template-columns:90px 1fr 92px}
  /* tables -> cards */
  .tbl.rsp{border:0;background:transparent}
  .tbl.rsp table,.tbl.rsp tbody,.tbl.rsp tr,.tbl.rsp td{display:block;width:100%}
  .tbl.rsp thead{display:none}
  .tbl.rsp tr{background:var(--bg2);border:1px solid var(--line);border-radius:12px;margin-bottom:10px;padding:6px 4px}
  .tbl.rsp tr.grp{background:transparent;border:0;padding:0}
  .tbl.rsp td{border:0;padding:5px 10px;display:flex;justify-content:space-between;gap:12px;text-align:left}
  .tbl.rsp td:before{content:attr(data-l);color:var(--muted);font-size:12.5px;text-align:right;flex:none}
  .tbl.rsp td[data-l=""]:before{content:none}
  .k4{grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
  .kpi{padding:12px}
  .kpi b{font-size:20px}
  #ceoTop{grid-template-columns:minmax(0,1fr)!important}
  #finWrap{top:56px}
  .kpi .sar{font-size:11px}
  .modal{border-radius:14px}
  .stbar span{padding:5px 10px 5px 12px;font-size:12px}
}

/* ===================== Polish v3 — تصميم أنعم وتفاعلي ===================== */
:root{
  --bg:#0E0630; --bg2:#140A3E; --field:#120836;
  --surface:rgb(var(--wrgb) / .035); --surface2:rgb(var(--wrgb) / .06);
  --line:rgba(190,175,255,.10); --line2:rgba(190,175,255,.20);
  --text:#F5F2FF; --muted:#A79FD0; --faint:#7A70A8;
  --r:18px; --ease:cubic-bezier(.2,.8,.2,1);
  --sh1:0 1px 0 rgb(var(--wrgb) / .05) inset,0 10px 30px -12px rgba(0,0,0,.55);
  --sh2:0 1px 0 rgb(var(--wrgb) / .07) inset,0 24px 50px -18px rgba(20,0,80,.85);
}
body{background:
  radial-gradient(1200px 600px at 85% -10%, rgba(106,43,255,.20), transparent 60%),
  radial-gradient(900px 500px at -10% 10%, rgba(60,184,240,.08), transparent 60%),
  var(--bg) fixed;
  font-feature-settings:"tnum" 1;}
::selection{background:rgba(106,43,255,.5)}
*{scrollbar-width:thin;scrollbar-color:rgba(167,159,208,.25) transparent}

/* top bar */
.top{background:rgba(14,6,48,.72);backdrop-filter:blur(18px) saturate(140%);border-bottom:1px solid var(--line)}
.menu a{position:relative;transition:color .2s,background .2s}
.menu a.on{background:transparent;color:#fff}
.menu a.on:after{content:"";position:absolute;inset-inline:12px;bottom:-9px;height:3px;border-radius:3px 3px 0 0;background:linear-gradient(90deg,var(--mint),var(--violet));box-shadow:0 0 12px rgba(69,224,165,.6)}
.ibtn{transition:background .2s,transform .2s}
.ibtn:active{transform:scale(.92)}
.ibtn .cnt{animation:pop .5s var(--ease) both;box-shadow:0 0 0 2px var(--bg)}
@keyframes pop{0%{transform:scale(0)}70%{transform:scale(1.2)}100%{transform:scale(1)}}
.drop{background:rgba(24,12,70,.92);backdrop-filter:blur(20px);border-radius:16px;animation:dd .22s var(--ease) both}
@keyframes dd{from{opacity:0;transform:translateY(-8px) scale(.98)}}
.drop .it{transition:background .15s}
#ddNotif{max-height:70vh;overflow:auto}
.dotc{box-shadow:0 0 0 4px color-mix(in srgb,currentColor 0%,transparent)}

/* cards */
.card{position:relative;background:linear-gradient(180deg,rgb(var(--wrgb) / .055),rgb(var(--wrgb) / .02));border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--sh1);transition:transform .35s var(--ease),border-color .3s,box-shadow .35s}
.card:before{content:"";position:absolute;inset:0;border-radius:inherit;pointer-events:none;opacity:0;transition:opacity .3s;
  background:radial-gradient(420px circle at var(--mx,50%) var(--my,50%),rgba(143,107,255,.13),transparent 45%)}
.card:hover:before{opacity:1}
.card:hover{border-color:var(--line2)}
.kc:hover,.kpi:hover{transform:translateY(-3px);box-shadow:var(--sh2)}
.sheet,.fhead,.chatter,.tbl,.modal{background:rgba(20,10,62,.75);backdrop-filter:blur(8px);border-color:var(--line);box-shadow:var(--sh1)}
.sheet,.chatter,.tbl{border-radius:var(--r)}

/* KPI */
.kpi{padding:16px 16px 14px;background:
  radial-gradient(120% 90% at 100% 0%,color-mix(in srgb,var(--c,var(--violet)) 22%,transparent),transparent 58%),
  linear-gradient(180deg,rgb(var(--wrgb) / .05),rgb(var(--wrgb) / .015))}
.kpi:after{inset:0 0 auto 0;width:auto;height:1px;border-radius:0;box-shadow:none;
  background:linear-gradient(270deg,transparent,color-mix(in srgb,var(--c,var(--violet)) 90%,transparent) 30%,transparent 85%)}
.kpi small{font-size:12.5px;font-weight:500;letter-spacing:.1px}
.kpi b{font-size:clamp(22px,1.9vw,29px);letter-spacing:.2px;margin-top:8px;white-space:nowrap}
.kpi em{display:inline-flex;align-items:center;gap:4px;margin-top:4px}
.kic{width:34px;height:34px;border-radius:11px;display:grid;place-items:center;flex:none;
  color:var(--c);background:color-mix(in srgb,var(--c) 16%,transparent);border:1px solid color-mix(in srgb,var(--c) 30%,transparent)}
.kic svg{width:18px;height:18px}
.spark{display:block;width:100%;height:34px;margin-top:8px;overflow:visible}
.spark path.ln{fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;stroke-dasharray:var(--L);stroke-dashoffset:var(--L);animation:draw 1.2s .2s var(--ease) forwards}
.spark path.ar{opacity:0;animation:fade .8s .7s forwards}
.trend{display:inline-flex;align-items:center;gap:3px;padding:1px 7px;border-radius:20px;font:600 11.5px var(--en);direction:ltr}
.trend.up{color:var(--mint);background:rgba(69,224,165,.12)} .trend.dn{color:var(--bad);background:rgba(255,77,109,.12)}
@keyframes draw{to{stroke-dashoffset:0}}
@keyframes fade{to{opacity:1}}

/* entrance */
.rv{animation:rise .55s var(--ease) both;animation-delay:calc(var(--i,0)*45ms)}
@keyframes rise{from{opacity:0;transform:translateY(14px)}}
.page{animation:fade0 .3s ease both}@keyframes fade0{from{opacity:0}}

/* buttons */
.btn{border-radius:11px;transition:transform .15s,background .2s,border-color .2s,box-shadow .2s;position:relative;overflow:hidden}
.btn:hover{transform:translateY(-1px)}
.btn:active{transform:translateY(0) scale(.98)}
.btn.pri{background:linear-gradient(135deg,#7B3CFF,#5B10F0);border-color:transparent;box-shadow:0 8px 20px -8px rgba(91,16,240,.8)}
.btn.pri:hover{box-shadow:0 10px 26px -8px rgba(123,60,255,.95)}
.btn.mint{background:linear-gradient(135deg,#5FF0B8,#2FCB8E);border-color:transparent;box-shadow:0 8px 20px -10px rgba(69,224,165,.8)}
.rip{position:absolute;border-radius:50%;transform:scale(0);background:rgb(var(--wrgb) / .35);animation:rip .6s ease-out;pointer-events:none}
@keyframes rip{to{transform:scale(4);opacity:0}}

/* tables */
.tbl{overflow:auto}
th{background:rgb(var(--wrgb) / .03);position:sticky;top:0;z-index:1;font-weight:600;letter-spacing:.2px}
tbody tr{transition:background .15s}
tbody tr.go:hover td{background:rgba(143,107,255,.09)}
tbody tr.go td:first-child{position:relative}
tbody tr.go:hover td:first-child:before{content:"";position:absolute;inset-block:8px;inset-inline-start:0;width:3px;border-radius:3px;background:var(--mint)}
.pill{border:0;background:color-mix(in srgb,currentColor 13%,transparent);padding:3px 11px}
.s-done{color:#D9D4F5}

/* tabs, status bar, smart buttons */
.tabs button{transition:color .2s,border-color .25s}
.tabs button.on{border-image:linear-gradient(90deg,var(--mint),var(--violet)) 1}
.stbar span.cur{background:linear-gradient(135deg,rgba(123,60,255,.65),rgba(91,16,240,.5));box-shadow:0 0 18px -4px rgba(123,60,255,.8)}
.sb{transition:border-color .2s,transform .2s,background .2s;border-radius:13px}
.sb:hover{transform:translateY(-2px);background:rgba(69,224,165,.06)}

/* bars */
.bar{height:7px;background:rgb(var(--wrgb) / .07)}
.bar i{background:linear-gradient(270deg,var(--c,var(--mint)),color-mix(in srgb,var(--c,var(--mint)) 55%,#fff 0%));box-shadow:none;transform-origin:right;animation:gx 1s var(--ease) both}
@keyframes gx{from{transform:scaleX(0)}}
.hbars .t,.hbt{background:rgb(var(--wrgb) / .06)}
.hbars .t i{transform-origin:right;animation:gx 1s var(--ease) both}

/* charts */
.chart{position:relative}
.chart svg{display:block;overflow:visible}
.chart .gl{stroke:rgb(var(--wrgb) / .07);stroke-dasharray:3 4}
.chart .zl{stroke:rgb(var(--wrgb) / .28)}
.chart .ax{fill:#8D84BC;font-size:10.5px}
.chart .cb{transform-box:fill-box;animation:gy .8s var(--ease) both}
.chart .cb.neg{transform-origin:top}.chart .cb.pos{transform-origin:bottom}
@keyframes gy{from{transform:scaleY(0)}}
.chart .col{fill:transparent;transition:fill .15s}
.chart .grp:hover .col{fill:rgb(var(--wrgb) / .045)}
.chart .grp .cb{transition:opacity .2s,filter .2s}
.chart:hover .grp .cb{opacity:.55}
.chart .grp:hover .cb{opacity:1;filter:brightness(1.15)}
.chart .ln{fill:none;stroke-width:2.6;stroke-linecap:round;stroke-linejoin:round;stroke-dasharray:var(--L);stroke-dashoffset:var(--L);animation:draw 1.4s .25s var(--ease) forwards}
.chart .ar{opacity:0;animation:fade .8s .8s forwards}
.chart .dt{opacity:0;animation:fade .3s 1.2s forwards;transition:r .15s}
.chart .grp:hover .dt{r:5.5}
.chart .off{display:none}
.legend span{cursor:default;transition:opacity .2s}
.legend.tg span{cursor:pointer;user-select:none;padding:3px 9px;border-radius:20px;background:rgb(var(--wrgb) / .04);border:1px solid var(--line)}
.legend.tg span.dim{opacity:.4;text-decoration:line-through}
.legend i{border-radius:50%}

/* hBars v3 */
.hb{gap:9px}
.hbr{padding:4px 6px;border-radius:9px;transition:background .15s}
.hbr:hover{background:rgb(var(--wrgb) / .04)}
.hbt{height:9px;border-radius:6px;overflow:hidden}
.hbt i{border-radius:6px;animation:gx 1s var(--ease) both;transform-origin:right}
.hbt i.ngx{transform-origin:left}
.hbt i.mid{animation:none;background:rgb(var(--wrgb) / .3)}

/* donut v3 */
.dn{position:relative;display:inline-grid;place-items:center}
.dn svg{transform:rotate(-90deg)}
.dn circle.sg{fill:none;stroke-linecap:round;transition:stroke-width .2s;animation:dn 1.1s var(--ease) both;cursor:pointer}
.dn circle.sg:hover{stroke-width:22}
@keyframes dn{from{stroke-dasharray:0 999}}
.dn .ctr{position:absolute;text-align:center;line-height:1.15;pointer-events:none}
.dn .ctr b{display:block;font:700 24px var(--en)}
.dn .ctr small{font-size:11px;color:var(--muted)}

/* segmented control */
.seg{display:inline-flex;background:rgb(var(--wrgb) / .04);border:1px solid var(--line);border-radius:11px;padding:3px;gap:2px}
.seg button{border:0;background:transparent;color:var(--muted);padding:4px 11px;border-radius:8px;font-size:12px;transition:.2s}
.seg button.on{background:rgba(143,107,255,.35);color:#fff;box-shadow:0 2px 10px -2px rgba(91,16,240,.7)}

/* tooltip */
#tip{background:rgba(16,8,48,.92);backdrop-filter:blur(12px);border:1px solid var(--line2);border-radius:11px;padding:8px 12px;box-shadow:0 14px 34px -10px rgba(0,0,0,.7);white-space:pre-line;line-height:1.65;font-size:12.5px;transition:opacity .12s,transform .12s}

/* home */
.home{background:
  radial-gradient(900px 520px at 50% 118%, rgba(91,16,240,.70), transparent 70%),
  radial-gradient(520px 380px at 0% 100%, rgba(255,107,26,.28), transparent 70%),
  radial-gradient(520px 380px at 100% 0%, rgba(240,32,140,.18), transparent 70%),
  linear-gradient(180deg,#160046 0%,#220060 100%)}
.home .orb{position:absolute;border-radius:50%;filter:blur(60px);opacity:.45;pointer-events:none;animation:float 14s ease-in-out infinite alternate}
@keyframes float{to{transform:translate(40px,-30px) scale(1.1)}}
.tile{border-radius:24px;transition:transform .35s var(--ease),box-shadow .35s;box-shadow:0 12px 30px -8px rgba(0,0,0,.5),inset 0 -3px 0 rgba(36,0,98,.08)}
.app{animation:rise .6s var(--ease) both;animation-delay:calc(var(--i,0)*60ms)}
.app:hover .tile{transform:translateY(-6px) scale(1.04);box-shadow:0 22px 40px -10px rgba(91,16,240,.75)}
.app:active .tile{transform:scale(.96)}
.wchip{backdrop-filter:blur(8px);transition:transform .2s,background .2s}
.wchip:hover{transform:translateY(-2px)}

/* toasts / modals */
.mbg{backdrop-filter:blur(6px)}
.mbg.open .modal{animation:rise .35s var(--ease) both}
.toast{border-radius:14px;backdrop-filter:blur(14px);background:rgba(28,14,80,.9)}

.pd3>.card:nth-child(3){grid-column:1/-1}
/* rec cards */
.recc{border-inline-start:3px solid var(--rc)!important}

@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
@media (max-width:760px){.kpi b{font-size:21px}.kic{width:28px;height:28px;border-radius:9px}.kic svg{width:15px;height:15px}.menu a.on:after{display:none}}

/* ===================== Theme v4 — مطابق لنظام الطلبات المالية ===================== */
:root{
  --bg:#08072A;--bg2:#0D0B3B;--card:rgba(255,255,255,.035);--card2:rgba(255,255,255,.06);--solid:#110E44;--field:#0B0935;
  --line:rgba(255,255,255,.08);--line2:rgba(255,255,255,.13);
  --text:#EDEAFB;--ink:#EDEAFB;--muted:rgba(237,234,251,.68);--faint:rgba(237,234,251,.44);
  --violet:#7B2FFF;--violet2:#7B2FFF;--vink:#B9A0FF;--mint:#00E5A0;--orange:#FF8A2A;--pink:#F0208C;--sky:#00C4FF;--cyan:#00C4FF;
  --ok:#00E5A0;--warn:#FF8A2A;--bad:#FF5C6C;--red:#FF5C6C;
  --shadow:0 24px 60px -28px rgba(0,0,0,.8);
  --side:linear-gradient(180deg,#0D0B3B 0%,#08072A 100%);--sideline:rgba(255,255,255,.08);
  --glow:radial-gradient(900px 500px at 85% -10%,rgba(123,47,255,.20),transparent 60%),radial-gradient(700px 420px at 0% 100%,rgba(0,196,255,.07),transparent 60%);
  --wrgb:255 255 255;--r:10px;color-scheme:dark;
  --ar:"IBM Plex Sans Arabic","Thmanyah Sans",Tahoma,sans-serif;--en:"Barlow Condensed","IBM Plex Sans Arabic",sans-serif;
  --sh1:var(--shadow);--sh2:0 26px 60px -24px rgba(0,0,0,.85);
}
:root[data-theme="light"]{
  --bg:#F4F2FB;--bg2:#ECE8FA;--card:#FFFFFF;--card2:#F7F5FF;--solid:#FFFFFF;--field:#FBFAFF;
  --line:rgba(31,8,112,.10);--line2:rgba(31,8,112,.16);
  --text:#140C46;--ink:#140C46;--muted:#4B4475;--faint:#837DA6;
  --violet:#5A1CE6;--violet2:#5A1CE6;--vink:#5A1CE6;--mint:#00936A;--orange:#C4540A;--sky:#0086C2;--cyan:#0086C2;--pink:#C8106E;
  --ok:#00936A;--warn:#C4540A;--bad:#D02F45;--red:#D02F45;
  --shadow:0 18px 40px -26px rgba(31,8,112,.35);--sh2:0 22px 46px -24px rgba(31,8,112,.45);
  --side:linear-gradient(180deg,#1F0870 0%,#130A45 100%);--sideline:rgba(255,255,255,.10);
  --glow:radial-gradient(900px 500px at 85% -10%,rgba(90,28,230,.10),transparent 60%);
  --wrgb:31 8 112;color-scheme:light;
}
html,body{background:var(--bg)}
body{font-family:var(--ar);background:var(--bg);background-image:var(--glow);background-attachment:fixed;color:var(--text);font-size:14px;line-height:1.55}
::selection{background:color-mix(in srgb,var(--violet) 45%,transparent)}

/* شريط علوي */
.top{height:62px;padding:0 24px;background:color-mix(in srgb,var(--bg) 82%,transparent);backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.top .crumbt{font-size:13px;color:var(--faint);white-space:nowrap}
.top .crumbt b{color:var(--text);font-weight:600}
.ibtn{width:38px;height:38px;border-radius:8px;border:1px solid var(--line);background:var(--card);color:var(--text)}
.ibtn:hover{border-color:var(--violet);background:var(--card2)}
.top.home-top .ibtn{background:rgba(255,255,255,.06);border-color:rgba(255,255,255,.14);color:#fff}
.ibtn .cnt{background:var(--orange);color:#1B0B00;box-shadow:0 0 0 2px var(--bg)}
.av{background:rgba(155,107,255,.25);border:1px solid rgba(155,107,255,.55);color:#fff}
:root[data-theme="light"] .top:not(.home-top) .av{color:var(--violet)}
.cmp{color:var(--faint)}
.x-unused{display:inline-flex;align-items:center;gap:7px;height:38px;padding:0 13px;border-radius:8px;border:1px solid color-mix(in srgb,var(--violet) 55%,transparent);background:linear-gradient(135deg,color-mix(in srgb,var(--violet) 28%,transparent),color-mix(in srgb,var(--cyan) 14%,transparent));color:var(--text);font-weight:600;font-size:13px;cursor:pointer;white-space:nowrap}
.x-unused svg{width:17px;height:17px;color:var(--vink)}
.x-unused:hover{filter:brightness(1.15)}
.top.home-top .x-unused{color:#fff}

/* الصفحة */
.page{max-width:1360px;padding:26px 30px 70px;animation:none}
.crumb{font-size:22px;font-weight:700;letter-spacing:-.01em}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow);transition:border-color .2s,transform .25s}
.card:before{display:none}
.card:hover{border-color:var(--line2)}
.kc:hover,.kpi:hover{transform:translateY(-2px);box-shadow:var(--sh2)}
.sheet,.fhead,.chatter,.tbl,.modal{background:var(--card);backdrop-filter:none;border-color:var(--line);box-shadow:var(--shadow);border-radius:var(--r)}
.modal{background:var(--solid)}
.kpi{background:var(--card);padding:18px 18px 16px}
.kpi:after{content:"";position:absolute;inset:16px auto 16px 0;right:0;left:auto;width:3px;height:auto;border-radius:3px;background:var(--c,var(--violet));box-shadow:none}
.kpi small{font-size:12.5px;color:var(--muted);font-weight:600}
.kpi b{font-family:var(--en);font-weight:700;font-size:clamp(22px,1.9vw,30px)}
.kic{border-radius:8px}
.btn{border-radius:8px;border:1px solid var(--line);background:var(--card);color:var(--text);box-shadow:none}
.btn:hover{border-color:var(--violet);transform:none}
.btn.pri{background:var(--violet);border-color:var(--violet);color:#fff;box-shadow:none}
.btn.pri:hover{filter:brightness(1.1)}
.btn.mint{background:var(--mint);border-color:var(--mint);color:#04261B;box-shadow:none}
.btn.bad{color:var(--bad);border-color:color-mix(in srgb,var(--bad) 45%,transparent)}
.pill{border:1px solid color-mix(in srgb,currentColor 40%,transparent);background:color-mix(in srgb,currentColor 12%,transparent)}
.s-wait{color:var(--orange)}.s-ok{color:var(--mint)}.s-info{color:var(--sky)}.s-bad{color:var(--bad)}.s-draft{color:var(--faint)}.s-done{color:var(--muted)}
th{background:var(--card2);color:var(--faint);font-size:12px}
td{border-bottom-color:var(--line)}

function projectForm(id,tab){
  const p=project(id); if(!p)return '<div class="empty">غير موجود</div>';
  const r=S.role, ct=costTotal(p), cv=contract(p)||quoteTotal(p), profit=cv-p.actual;
  const pos=S.pos.filter(o=>o.project===id), cus=S.custody.filter(c=>c.project===id), reqs=S.requests.filter(q=>q.project===id), cu=partner(p.customer);
  const tabs=[['overview','نظرة عامة'],['tasks','المهام'],['cost','الكوست شيت'],['quote','عرض السعر'],['po','المشتريات'],['custody','العهد'],['requests','الطلبات المالية'],['docs','المستندات'],['team','الفريق']].filter(t=>has(can.tab[t[0]]));
  tab=tabs.find(t=>t[0]===tab)?tab:'overview';
  const acts=[];
  if(has(['pm'])&&p.stage<5)acts.push('<button class="btn pri" onclick="reqCustody(\''+id+'\')">طلب عهدة</button>');

  const kpis=[];
  if(has(can.kpi.value))kpis.push(['قيمة العقد'+(contract(p)?'':' (مقترحة)'),cv,'--c:var(--violet)']);
  if(has(can.kpi.cost))kpis.push(['التكلفة التقديرية',ct,'--c:var(--sky)']);
  if(has(can.kpi.actual))kpis.push(['المصروف الفعلي (من أودو)',p.actual,'--c:var(--orange)']);
  if(has(can.kpi.profit))kpis.push(['الربح المتوقع · الهامش '+(cv?Math.round((cv-ct)/cv*100):0)+'%',cv-ct,'--c:var(--mint)']);
  const sm=[];
  if(has(can.tab.tasks))sm.push(['task',p.tasks.length,'المهام',"go('projects/view/"+id+"/tasks')"]);
  if(has(can.tab.po))sm.push(['cart',pos.length,'أوامر الشراء',"go('projects/view/"+id+"/po')"]);
  if(has(can.tab.custody))sm.push(['wallet',cus.length,'العهد',"go('projects/view/"+id+"/custody')"]);
  if(has(can.tab.requests))sm.push(['money',reqs.length,'الطلبات المالية',"go('projects/view/"+id+"/requests')"]);
  if(has(can.tab.docs))sm.push(['doc',Object.keys(cu.docs||{}).length+1,'المستندات',"go('projects/view/"+id+"/docs')"]);
  if(has(can.tab.team))sm.push(['team',p.team.length,'الفريق',"go('projects/view/"+id+"/team')"]);
  const body='<div class="faint n" style="font-size:12.5px">'+p.id+'</div><h2>'+p.name+'</h2><div class="muted">'+cu.name+' · '+p.company+' · <span class="n">'+p.start+'</span> ← <span class="n">'+p.end+'</span></div>'+
    smart(sm)+
    (kpis.length&&tab!=='overview'?'<div class="grid k4">'+kpis.map(k=>'<div class="card kpi" style="'+k[2]+'"><small>'+k[0]+'</small><b>'+sar(k[1])+'</b></div>').join('')+'</div>':'')+
    '<div class="tabs">'+tabs.map(t=>'<button class="'+(t[0]===tab?'on':'')+'" onclick="go(\'projects/view/'+id+'/'+t[0]+'\')">'+t[1]+'</button>').join('')+'</div>'+
    '<div>'+projectTab(p,tab)+'</div>'+
    (tabs.length<9&&!has(ALL)?'<div class="faint" style="font-size:12px;margin-top:14px">🔒 تظهر لك أقسام المشروع الخاصة بإدارتك فقط. المالية والرئيس التنفيذي يرون كل شيء.</div>':'');
  return formView({crumbs:[['المشاريع','projects'],[p.name]],steps:STAGES,cur:p.stage,actions:acts,body,log:p.log,logKey:'prj:'+id});
}
function projectTab(p,tab){
  const id=p.id, ct=costTotal(p);
  if(tab==='overview')return projDash(p);
  if(tab==='tasks')return '<div class="tbl rsp"><table><thead><tr><th>المهمة</th><th>المسؤول</th><th>الاستحقاق</th><th>الحالة</th></tr></thead><tbody>'+(p.tasks.map(t=>{const late=t.st!=='منجزة'&&days(t.due)<0;return '<tr><td data-l="المهمة">'+t.t+'</td><td data-l="المسؤول">'+t.who+'</td><td data-l="الاستحقاق"><span class="n">'+t.due+'</span> '+(late?pill('bad','متأخرة'):'')+'</td><td data-l="الحالة">'+pill(t.st==='منجزة'?'ok':t.st==='جديدة'?'draft':'info',t.st)+'</td></tr>'}).join('')||'<tr><td colspan="4" class="empty">لا توجد مهام</td></tr>')+'</tbody></table></div>'+(has(['pm'])?'<button class="btn sm" style="margin-top:10px" onclick="addTask(\''+id+'\')">+ مهمة</button>':'');
  if(tab==='cost'){
    const edit=has(['pm'])&&p.cost.status==='draft';
    const items=S.products.filter(x=>x.kind==='purchase'&&x.depts.includes('projects'));
    return '<div style="display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:10px"><div>'+(p.cost.status==='draft'?pill('draft','مسودة — يعدّها مدير المشروع'):pill('ok','أُرسل للمبيعات'))+'</div>'+
      (edit?'<div class="acts"><button class="btn sm" onclick="addCostLine(\''+id+'\')">+ بند</button><button class="btn sm mint" onclick="submitCost(\''+id+'\')" '+(p.cost.lines.length?'':'disabled')+'>إرسال للمبيعات</button></div>':'')+'</div>'+
      '<div class="tbl rsp"><table><thead><tr><th>البند (من قائمة المالية)</th><th>الكمية</th><th>تكلفة الوحدة</th><th>الإجمالي</th>'+(edit?'<th></th>':'')+'</tr></thead><tbody>'+
      p.cost.lines.map((l,i)=>'<tr><td data-l="البند">'+(edit?'<select class="cin" onchange="project(\''+id+'\').cost.lines['+i+'].p=this.value">'+items.map(it=>'<option value="'+it.id+'" '+(it.id===l.p?'selected':'')+'>'+it.name+'</option>').join('')+'</select>':prod(l.p).name)+'</td>'+
        '<td data-l="الكمية">'+(edit?'<input class="cin" type="number" value="'+l.q+'" onchange="project(\''+id+'\').cost.lines['+i+'].q=+this.value;rerender()">':'<span class="n">'+fmt(l.q)+'</span>')+'</td>'+
        '<td data-l="تكلفة الوحدة">'+(edit?'<input class="cin" type="number" value="'+l.c+'" onchange="project(\''+id+'\').cost.lines['+i+'].c=+this.value;rerender()">':sar(l.c))+'</td><td data-l="الإجمالي">'+sar(l.q*l.c)+'</td>'+(edit?'<td data-l=""><button class="btn sm bad" onclick="project(\''+id+'\').cost.lines.splice('+i+',1);rerender()">حذف</button></td>':'')+'</tr>').join('')+
      '<tr><td data-l=""><b>إجمالي التكلفة التقديرية</b></td><td data-l=""></td><td data-l=""></td><td data-l="الإجمالي"><b>'+sar(ct)+'</b></td>'+(edit?'<td data-l=""></td>':'')+'</tr></tbody></table></div>'+
      '<div class="faint" style="font-size:12px;margin-top:8px">البنود تُختار من القائمة التي تحددها الإدارة المالية فقط.</div>';
  }
  if(tab==='quote'){
    const q=p.quote, canEdit=has(['sales'])&&p.cost.status==='submitted'&&['none','draft','rejected'].includes(q.status);
    if(p.cost.status!=='submitted')return '<div class="alert info">عرض السعر يُجهز بعد أن يرسل مدير المشروع الكوست شيت.</div>';
    const showCost=has(['cfo','ceo','sales','pm']);
    const acts=[];
    if(canEdit)acts.push('<button class="btn mint sm" onclick="submitQuote(\''+id+'\')">إرسال للموافقة</button>');
    if(q.status==='wait_cfo'&&S.role==='cfo')acts.push('<button class="btn mint sm" onclick="approveQuote(\''+id+'\')">موافقة المالية</button><button class="btn bad sm" onclick="rejectQuote(\''+id+'\')">رفض</button>');
    if(q.status==='wait_ceo'&&S.role==='ceo')acts.push('<button class="btn mint sm" onclick="approveQuote(\''+id+'\')">موافقة الرئيس التنفيذي</button><button class="btn bad sm" onclick="rejectQuote(\''+id+'\')">رفض</button>');
    if(q.status==='approved'&&has(['sales']))acts.push('<button class="btn pri sm" onclick="sendQuote(\''+id+'\')">إصدار PDF وإرساله للعميل</button>');
    if(['approved','sent','wait_cfo','wait_ceo'].includes(q.status))acts.push('<button class="btn sm" onclick="quotePDF(\''+id+'\')">معاينة PDF</button>');
    const steps=[['المبيعات',!['none','draft','rejected'].includes(q.status)],['الإدارة المالية',['wait_ceo','approved','sent'].includes(q.status)],['الرئيس التنفيذي',['approved','sent'].includes(q.status)],['إرسال للعميل',q.status==='sent']];
    return '<div style="display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:12px"><div>'+quotePill(p)+(q.reason?' <span class="muted" style="font-size:12.5px">السبب: '+esc(q.reason)+'</span>':'')+'</div><div class="acts">'+acts.join('')+'</div></div>'+
      '<div class="stbar" style="margin-bottom:14px">'+steps.map(s=>'<span class="'+(s[1]?'cur':'')+'">'+(s[1]?'✓ ':'')+s[0]+'</span>').join('')+'</div>'+
      '<div class="grid k4" style="margin-bottom:12px">'+(showCost?'<div class="card kpi" style="--c:var(--sky)"><small>التكلفة (من الكوست شيت)</small><b>'+sar(ct)+'</b></div>':'')+
      '<div class="card kpi" style="--c:var(--orange)"><small>هامش الربح</small><b>'+(canEdit?'<input class="cin n" style="width:90px;font-size:20px" type="number" value="'+q.margin+'" onchange="project(\''+id+'\').quote.margin=+this.value;rerender()">':'<span class="n">'+q.margin+'</span>')+' <span class="sar">%</span></b></div>'+
      '<div class="card kpi" style="--c:var(--mint)"><small>سعر البيع قبل الضريبة</small><b>'+sar(quoteTotal(p))+'</b></div><div class="card kpi"><small>شامل ضريبة 15%</small><b>'+sar(quoteTotal(p)*1.15)+'</b></div></div>'+
      '<div class="tbl rsp"><table><thead><tr><th>البند</th><th>الكمية</th>'+(showCost?'<th>التكلفة</th>':'')+'<th>سعر البيع للعميل</th></tr></thead><tbody>'+p.cost.lines.map(l=>'<tr><td data-l="البند">'+prod(l.p).name+'</td><td data-l="الكمية"><span class="n">'+fmt(l.q)+'</span></td>'+(showCost?'<td data-l="التكلفة">'+sar(l.q*l.c)+'</td>':'')+'<td data-l="سعر البيع">'+sar(l.q*l.c*(1+q.margin/100))+'</td></tr>').join('')+'</tbody></table></div>'+
      '<div class="faint" style="font-size:12px;margin-top:8px">العميل يرى سعر البيع فقط — التكلفة والهامش داخليان.</div>';
  }
  if(tab==='po'){const pos=S.pos.filter(o=>o.project===id);return poTable(pos)+(has(['pm','pur'])&&p.stage>=3?'<button class="btn sm mint" style="margin-top:10px" onclick="newPO(\''+id+'\')">+ أمر شراء من عرض سعر PDF</button>':'')}
  if(tab==='custody')return custodyTable(S.custody.filter(c=>c.project===id))+(has(['pm'])?'<button class="btn sm mint" style="margin-top:10px" onclick="reqCustody(\''+id+'\')">+ طلب عهدة (حد أقصى 5,000)</button>':'');
  if(tab==='requests')return reqTable(S.requests.filter(q=>q.project===id));
  if(tab==='docs'){const cu=partner(p.customer);return '<h4 style="margin:0 0 10px">أوراق العميل الرسمية — '+cu.name+'</h4>'+docsGrid(cu)+'<h4 style="margin:16px 0 10px">مستندات المشروع</h4><div class="grid k3">'+[['عرض السعر '+(p.quote.no||''),p.quote.status==='sent'],['العقد الموقع',p.stage>=4]].map(d=>'<div class="slot '+(d[1]?'ok':'')+'"><div class="ic">'+(d[1]?'✓':'—')+'</div><div><b style="font-size:13.5px">'+d[0]+'</b><small>'+(d[1]?'مرفق':'لم يُرفق بعد')+'</small></div></div>').join('')+'</div>'}
  if(tab==='team')return '<div class="tbl rsp"><table><thead><tr><th>الاسم</th><th>الدور</th><th>الساعات المسجلة</th></tr></thead><tbody>'+p.team.map(t=>'<tr><td data-l="الاسم">'+t[0]+'</td><td data-l="الدور">'+t[1]+'</td><td data-l="الساعات"><span class="n">'+t[2]+'</span></td></tr>').join('')+'</tbody></table></div>';
  return '';
}

/* ---------- داشبورد المشروع ---------- */
function kcard(ic,label,val,sub,c){return '<div class="card kpi" style="--c:'+c+'"><div style="display:flex;justify-content:space-between;align-items:flex-start;gap:8px"><small>'+label+'</small><span style="color:'+c+';opacity:.9">'+ic+'</span></div><b>'+val+'</b>'+(sub?'<em>'+sub+'</em>':'')+'</div>'}
function hbar(rows,max,color){return '<div class="hbars">'+rows.map(r=>'<div class="r" style="grid-template-columns:minmax(70px,38%) minmax(40px,1fr) 58px;gap:8px"><span style="font-size:12px;line-height:1.3">'+r[0]+'</span><div class="t"><i style="width:'+(max?r[1]/max*100:0)+'%;background:'+(r[2]||color)+'"></i></div><span class="n" style="text-align:left;font-size:13px">'+fmt(r[1])+'</span></div>').join('')+'</div>'}
function projDash(p){
  const fin=has(ALL), pm=has(['pm']);
  const T=p.tasks, done=T.filter(t=>t.st==='منجزة').length, late=T.filter(t=>t.st!=='منجزة'&&days(t.due)<0).length;
  const H=p.hours||{plan:0,act:0};
  const pnl=p.pnl||{rev:[],cost:[],admin:[]};
  const rev=pnl.rev.reduce((a,x)=>a+x[2],0), cost=pnl.cost.reduce((a,x)=>a+x[2],0), adm=pnl.admin.reduce((a,x)=>a+x[2],0), net=rev-cost-adm;
  const bud=costTotal(p), spent=p.actual, dev=spent-bud;
  const cus=S.custody.filter(c=>c.project===p.id&&c.status!=='closed').reduce((a,c)=>a+c.amount,0);
  const pos=S.pos.filter(o=>o.project===p.id);
  const ic=k=>({t:'☰',ok:'✓',late:'⏱',h:'⌛',up:'↑',down:'↓',bal:'⚖',pct:'▥'})[k];
  let h='<div class="grid k4" style="margin-bottom:14px">'+
    kcard(ic('t'),'إجمالي المهام','<span class="n">'+T.length+'</span>','','var(--sky)')+
    kcard(ic('ok'),'مكتملة','<span class="n">'+done+'</span>',(T.length?Math.round(done/T.length*100):0)+'%','var(--mint)')+
    kcard(ic('late'),'متأخرة','<span class="n">'+late+'</span>','','var(--bad)')+
    kcard(ic('h'),'ساعات فعلية','<span class="n">'+fmt(H.act)+'h</span>','من '+fmt(H.plan)+'h مخططة','var(--violet)')+'</div>';
  if(fin)h+='<div class="grid k4" style="margin-bottom:14px">'+
    kcard(ic('up'),'الإيرادات',sar(rev),'','var(--sky)')+
    kcard(ic('down'),'المصروفات',sar(cost+adm),'','var(--bad)')+
    kcard(ic('bal'),'صافي الربح',sar(net),rev?'الهامش '+Math.round(net/rev*100)+'%':'','var(--mint)')+
    kcard(ic('pct'),'استهلاك الساعات','<span class="n">'+(H.plan?Math.round(H.act/H.plan*100):0)+'%</span>','','var(--violet)')+'</div>';
  // charts
  const stages=['جديدة','قيد التنفيذ','بانتظار','منجزة'], sc=['var(--sky)','var(--violet)','var(--warn)','var(--mint)'];
  const byStage=stages.map((s,i)=>[s,T.filter(t=>t.st===s).length,sc[i]]);
  const al=p.actualByLine||p.cost.lines.map(()=>0);
  const bva=p.cost.lines.map((l,i)=>[prod(l.p).name,l.q*l.c,al[i]||0]);
  const mx=Math.max(1,...bva.flatMap(x=>[x[1],x[2]]));
  const empty=t=>'<div class="empty" style="padding:30px 10px">ⓘ '+t+'</div>';
  h+='<div class="grid pd3" style="grid-template-columns:repeat(auto-fit,minmax(300px,1fr));margin-bottom:14px">'+
    '<div class="card"><h4 style="margin:0 0 12px;font-size:14px">توزيع المهام حسب المرحلة</h4>'+(T.length?'<div style="display:flex;gap:18px;align-items:center;flex-wrap:wrap">'+donut(byStage.map(x=>[x[0],x[1]]),['#3CB8F0','#8F6BFF','#FFB020','#45E0A5'],140)+'<div style="flex:1;min-width:120px">'+byStage.map((x,i)=>'<div style="display:flex;justify-content:space-between;font-size:13px;margin-bottom:9px"><span><i style="display:inline-block;width:9px;height:9px;border-radius:50%;background:'+['#3CB8F0','#8F6BFF','#FFB020','#45E0A5'][i]+';margin-inline-end:7px"></i>'+x[0]+'</span><span class="n">'+x[1]+'</span></div>').join('')+'</div></div>':empty('لا توجد مهام'))+'</div>'+
    (fin||pm?'<div class="card"><h4 style="margin:0 0 4px;font-size:14px">الميزانية مقابل الفعلي</h4><div class="legend" style="margin-bottom:10px"><span><i style="background:rgba(176,167,218,.45)"></i>الميزانية</span><span><i style="background:var(--orange)"></i>الفعلي</span></div>'+(spent?'<div class="hbars">'+bva.map(x=>'<div class="r" style="grid-template-columns:minmax(70px,38%) minmax(40px,1fr) 42px;gap:8px;margin-bottom:10px"><span style="font-size:12px;line-height:1.3">'+x[0]+'</span><div><div class="t" style="height:7px;margin-bottom:3px"><i style="width:'+(x[1]/mx*100)+'%;background:rgba(176,167,218,.45)"></i></div><div class="t" style="height:7px"><i style="width:'+(x[2]/mx*100)+'%;background:'+(x[2]>x[1]?'var(--bad)':'var(--orange)')+'"></i></div></div><span class="n" style="text-align:left;font-size:12px;color:'+(x[2]>x[1]?'var(--bad)':'var(--muted)')+'">'+(x[1]?Math.round(x[2]/x[1]*100):0)+'%</span></div>').join('')+'</div>':empty('لا توجد بيانات صرف بعد'))+'</div>':'')+
    (fin||pm?'<div class="card"><h4 style="margin:0 0 12px;font-size:14px">المصروفات حسب الفئة</h4>'+(pnl.cost.length?hbar(pnl.cost.slice(0,7).map(x=>[x[1],x[2]]),pnl.cost[0][2],'var(--pink)'):empty('لا توجد مصروفات'))+'</div>':'')+'</div>';
  if(fin||pm){h+='<h4 style="margin:6px 0 10px">الميزانية</h4><div class="grid k4" style="margin-bottom:14px">'+
    kcard('▤','المبلغ المخطط (الكوست شيت)',sar(bud),'','var(--sky)')+kcard('✓','المصروف',sar(spent),bud?Math.round(spent/bud*100)+'% من المخطط':'','var(--mint)')+
    kcard('⚠','الانحراف',sar(Math.max(0,dev)),dev>0?'تجاوز للميزانية':'ضمن الميزانية',dev>0?'var(--bad)':'var(--mint)')+kcard('⚖','المتبقي',sar(Math.max(0,bud-spent)),'','var(--violet)')+'</div>'}
  if(fin||pm){h+='<h4 style="margin:6px 0 10px">العمليات المالية</h4><div class="grid k4" style="margin-bottom:14px">'+
    kcard('▣','صندوق العهدة',sar(cus),'عهد مفتوحة','var(--violet)')+kcard('✈','الانتدابات',sar(p.depu||0),'','var(--sky)')+
    (fin?kcard('🛒','أوامر البيع',sar(contract(p)*1.15),p.quote.no||'','var(--mint)'):'')+kcard('🚚','أوامر الشراء',sar(pos.reduce((a,o)=>a+o.total,0)),pos.length+' أمر','var(--bad)')+'</div>'}
  if(fin){
    const sec=(title,color,rows,totLabel,tot)=>'<tr><td colspan="3" style="background:'+color+';color:#fff;font-weight:700">'+title+'</td></tr>'+rows.map(r=>'<tr><td class="faint n" style="width:70px">'+r[0]+'</td><td>'+r[1]+'</td><td style="text-align:left">'+sar(r[2])+'</td></tr>').join('')+'<tr><td></td><td><b>'+totLabel+'</b></td><td style="text-align:left"><b>'+sar(tot)+'</b></td></tr>';
    h+='<h4 style="margin:6px 0 10px">قائمة دخل المشروع (من أودو)</h4>'+(rev||cost?'<div class="tbl"><table>'+sec('الإيرادات','linear-gradient(90deg,rgba(60,184,240,.08),rgba(60,184,240,.30))',pnl.rev,'إجمالي الإيرادات',rev)+sec('التكاليف','linear-gradient(90deg,rgba(255,77,109,.08),rgba(255,77,109,.28))',pnl.cost,'إجمالي التكاليف',cost)+
      '<tr><td></td><td><b>مجمل الربح</b></td><td style="text-align:left"><b>'+sar(rev-cost)+'</b></td></tr>'+sec('المصاريف الإدارية','linear-gradient(90deg,rgba(255,107,26,.08),rgba(255,107,26,.30))',pnl.admin,'إجمالي المصاريف الإدارية',adm)+
      '<tr><td></td><td style="color:var(--mint);font-size:16px"><b>صافي الربح / الخسارة</b></td><td style="text-align:left;color:var(--mint);font-size:16px"><b>'+sar(net)+'</b></td></tr></table></div>':'<div class="card empty">لا توجد قيود مرحّلة على هذا المشروع بعد</div>');
  }
  return h;
}
function tasksView(){
  const rows=[];S.projects.forEach(p=>p.tasks.forEach(t=>{if(S.role!=='emp'||t.who===me().name)rows.push({...t,p})}));
  return listView('tasks',{title:'المهام',rows,text:t=>t.t+t.p.name,
    filters:[['late','متأخرة',t=>t.st!=='منجزة'&&days(t.due)<0],['open','غير منجزة',t=>t.st!=='منجزة']],groups:[['p','المشروع',t=>t.p.name],['w','المسؤول',t=>t.who],['s','الحالة',t=>t.st]],
    cols:[['المهمة',t=>t.t],['المشروع',t=>t.p.name],['المسؤول',t=>t.who],['الاستحقاق',t=>'<span class="n">'+t.due+'</span> '+(t.st!=='منجزة'&&days(t.due)<0?pill('bad','متأخرة'):'')],['الحالة',t=>pill(t.st==='منجزة'?'ok':'info',t.st)]],

  const cur=q.status==='wait'?1+q.step:q.status==='je'?steps.length-2:q.status==='paid'?steps.length-1:0;

  cols:[['الرقم',c=>'<span class="n">'+c.id+'</span>'],['المشروع',c=>project(c.project).name],['المبلغ',c=>sar(c.amount)],['المصروف',c=>sar(cuSpent(c))],['البنود',c=>'<span class="n">'+c.lines.length+'</span>'],['الحالة',cuPill]],open:c=>"go('requests/cu/"+c.id+"')",defFilter:S.role==='cfo'?'rev':null})}

let CUSEL=0;
function custodyForm(id){
  const c=S.custody.find(x=>x.id===id); if(!c)return '<div class="empty">غير موجود</div>';
  const steps=['طلب','صرف المالية','مفتوحة — تصفية','مراجعة المالية','مقفلة'];
  const cur={requested:1,open:2,review:3,closed:4}[c.status];
  const acts=[];
  if(c.status==='requested'&&S.role==='cfo')acts.push('<button class="btn mint" onclick="issueCU(\''+id+'\')">صرف العهدة</button>');
  if(c.status==='open'&&S.role==='pm')acts.push('<button class="btn" onclick="addCULine(\''+id+'\')">+ بند مصروف</button>','<button class="btn mint" onclick="submitCU(\''+id+'\')" '+(c.lines.length?'':'disabled')+'>إرسال التصفية للمالية</button>');
  const reviewing=c.status==='review'&&S.role==='cfo';
  if(reviewing)acts.push('<button class="btn mint" onclick="approveCU(\''+id+'\')" '+(c.lines.every(l=>l.ok!==null)?'':'disabled')+'>اعتماد التصفية وإقفال العهدة</button>');
  if(CUSEL>=c.lines.length)CUSEL=0;
  const L=c.lines[CUSEL];
  const body='<div class="faint n">'+c.id+'</div><h2>عهدة '+project(c.project).name+'</h2><div class="muted">مدير المشروع: '+USERS.pm.name+(c.due?' · موعد التصفية <span class="n">'+c.due+'</span>':'')+'</div>'+
   '<div class="grid k4" style="margin:14px 0"><div class="card kpi" style="--c:var(--violet)"><small>مبلغ العهدة</small><b>'+sar(c.amount)+'</b></div><div class="card kpi" style="--c:var(--orange)"><small>المصروف</small><b>'+sar(cuSpent(c))+'</b></div><div class="card kpi" style="--c:var(--mint)"><small>المتبقي للرد</small><b>'+sar(c.amount-cuSpent(c))+'</b></div></div>'+
   (reviewing?'<div class="alert info" style="margin-bottom:12px">راجع كل بند مع مرفقه: اضغط على البند لعرض مرفقه، ثم ✓ أو ✗. بعد مراجعة كل البنود يتفعل زر الاعتماد.</div>':'')+
   (c.lines.length?'<div class="split"><div class="tbl rsp"><table><thead><tr><th>#</th><th>البند</th><th>الحساب</th><th>المبلغ</th><th>المرفق</th>'+(reviewing||c.status==='closed'?'<th>المراجعة</th>':'')+'</tr></thead><tbody>'+
     c.lines.map((l,i)=>'<tr class="go line-row '+(i===CUSEL?'sel':'')+'" onclick="CUSEL='+i+';rerender()"><td data-l="#"><span class="n">'+(i+1)+'</span></td><td data-l="البند">'+esc(l.d)+'</td><td data-l="الحساب"><span class="n">'+l.acc+'</span></td><td data-l="المبلغ">'+sar(l.a)+'</td><td data-l="المرفق">📎</td>'+(reviewing?'<td data-l="المراجعة" onclick="event.stopPropagation()"><button class="btn sm '+(l.ok===true?'mint':'')+'" onclick="cuMark(\''+id+'\','+i+',true)">✓</button> <button class="btn sm '+(l.ok===false?'bad':'')+'" onclick="cuMark(\''+id+'\','+i+',false)">✗</button></td>':c.status==='closed'?'<td data-l="المراجعة">'+(l.ok?pill('ok','مقبول'):pill('bad','مرفوض'))+'</td>':'')+'</tr>').join('')+'</tbody></table></div>'+
     '<div><div style="display:flex;justify-content:space-between;margin-bottom:6px"><b>مرفق البند '+(CUSEL+1)+': '+esc(L.d)+'</b><span>'+sar(L.a)+'</span></div><div class="prev">'+previewHTML(L.f,L.d,L.a)+'</div></div></div>':'<div class="card empty">'+(c.status==='open'?'أضف بنود المصروفات — كل بند يحتاج صورة أو PDF للفاتورة':'لا توجد بنود بعد')+'</div>');
  return formView({crumbs:[['العهد','requests/custody'],[c.id]],steps,cur,actions:acts,body,log:c.log,logKey:'cu:'+id});
}
function issueCU(id){const c=S.custody.find(x=>x.id===id);c.status='open';c.issued=TD();const je=makeJE(id,[['1150 عهد الموظفين — '+USERS.pm.name,c.amount,0],['1010 البنك',0,c.amount]]);log(c,'صُرفت العهدة · قيد مسودة '+je);notify('صُرفت العهدة '+id,'var(--mint)','requests/cu/'+id);showJE(je);rerender()}
function addCULine(id){const c=S.custody.find(x=>x.id===id);const accs=S.accounts.filter(a=>a.depts.includes('projects'));let F=null;window.onFile=(k,f)=>{if(k==='cul'){F=f;$('#culGo').disabled=!F}};
  modal('بند مصروف من العهدة','<div class="f"><label>البيان <span class="req">*</span></label><input id="cl_d" value="مستلزمات تركيب"></div><div class="two"><div class="f"><label>المبلغ شامل الضريبة <span class="req">*</span></label><input id="cl_a" type="number" value="350"></div><div class="f"><label>الحساب</label><select id="cl_acc">'+accs.map(a=>'<option value="'+a.code+'">'+a.code+' '+a.name+'</option>').join('')+'</select></div></div>'+fileSlot('cul','صورة / PDF الفاتورة',1),
  [['إضافة البند','mint',()=>{const a=+$('#cl_a').value;if(cuSpent(c)+a>c.amount){toast('المبلغ يتجاوز المتبقي من العهدة');return}c.lines.push({d:$('#cl_d').value,a,acc:$('#cl_acc').value,f:F,ok:null});closeM();window.onFile=null;rerender()},'culGo']]);$('#culGo').disabled=true}
function submitCU(id){const c=S.custody.find(x=>x.id===id);c.status='review';log(c,'أرسل التصفية للمراجعة ('+c.lines.length+' بنود)');notify('تصفية '+id+' بانتظار مراجعة المالية','var(--warn)','requests/cu/'+id);toast('أُرسلت التصفية للمالية');rerender()}
function cuMark(id,i,v){S.custody.find(x=>x.id===id).lines[i].ok=v;const c=S.custody.find(x=>x.id===id);if(i<c.lines.length-1)CUSEL=i+1;rerender()}
function approveCU(id){const c=S.custody.find(x=>x.id===id);const okL=c.lines.filter(l=>l.ok);const m={};okL.forEach(l=>m[l.acc]=(m[l.acc]||0)+l.a);const tot=okL.reduce((a,l)=>a+l.a,0);
  const lines=Object.entries(m).map(([k,v])=>[k+' '+acc(k).name,v,0]);if(c.amount-tot>0)lines.push(['1010 البنك (رد المتبقي)',c.amount-tot,0]);lines.push(['1150 عهد الموظفين — '+USERS.pm.name,0,c.amount]);
  const je=makeJE(id,lines);c.status='closed';log(c,'اعتمد التصفية ('+okL.length+' من '+c.lines.length+' بنود) وأقفل العهدة · قيد مسودة '+je);notify('أُقفلت العهدة '+id,'var(--mint)','requests/cu/'+id);showJE(je);rerender()}

function analysis(){
  const rows=reqVisible(), depts=has(ALL)?['projects','sales','purchasing','hr']:[me().dept];
  const tot=S.requests.reduce((a,q)=>a+q.amount,0);
  const colors={projects:'var(--violet)',sales:'var(--mint)',purchasing:'var(--orange)',hr:'var(--pink)'};
  const st=[['wait','قيد الاعتماد','var(--warn)'],['je','قيد مسودة','var(--sky)'],['paid','مدفوع','var(--mint)'],['rejected','مرفوض','var(--bad)']];
  const data=depts.map(d=>{const q=S.requests.filter(x=>x.dept===d);return {d,n:q.length,amt:q.reduce((a,x)=>a+x.amount,0),by:st.map(s=>q.filter(x=>x.status===s[0]).reduce((a,x)=>a+x.amount,0))}});
  const max=Math.max(...data.map(x=>x.amt),1);
  return '<div class="cp"><div class="crumb">تحليل الطلبات المالية</div><span class="muted" style="font-size:12.5px">'+(has(ALL)?'كل الإدارات':'إدارتك فقط')+'</span></div>'+
   '<div class="grid k4" style="margin-bottom:14px"><div class="card kpi" style="--c:var(--violet)"><small>عدد الطلبات</small><b class="n">'+rows.length+'</b></div><div class="card kpi" style="--c:var(--mint)"><small>إجمالي المبالغ</small><b>'+sar(rows.reduce((a,q)=>a+q.amount,0))+'</b></div><div class="card kpi" style="--c:var(--warn)"><small>قيد الاعتماد</small><b class="n">'+rows.filter(q=>q.status==='wait').length+'</b></div><div class="card kpi" style="--c:var(--bad)"><small>مرفوضة</small><b class="n">'+rows.filter(q=>q.status==='rejected').length+'</b></div></div>'+
   '<div class="card"><h4 style="margin:0 0 4px">المبالغ حسب الإدارة ونسبتها من الإجمالي</h4><div class="legend" style="margin-bottom:14px">'+st.map(s=>'<span><i style="background:'+s[2]+'"></i>'+s[1]+'</span>').join('')+'</div>'+
   '<div class="hbars">'+data.map(x=>'<div class="r"><span><b>'+DEPTS[x.d]+'</b><br><span class="faint n" style="font-size:12px">'+x.n+'</span> <span class="faint" style="font-size:12px">طلبات</span></span><div><div class="stack" style="width:'+(x.amt/max*100)+'%;height:14px">'+x.by.map((v,i)=>v?'<i style="width:'+(v/x.amt*100)+'%;background:'+st[i][2]+'"></i>':'').join('')+'</div></div><span style="text-align:left">'+sar(x.amt)+'<br><span class="n" style="color:'+colors[x.d]+'">'+(tot?Math.round(x.amt/tot*100):0)+'%</span> <span class="faint" style="font-size:12px">من الإجمالي</span></span></div>').join('')+'</div></div>'+
   '<h4 style="margin:18px 0 8px">أعلى البنود</h4>'+(()=>{const m={};rows.forEach(q=>m[q.acc]=(m[q.acc]||0)+q.amount);return '<div class="tbl rsp"><table><thead><tr><th>البند</th><th>المبلغ</th><th>النسبة</th></tr></thead><tbody>'+Object.entries(m).sort((a,b)=>b[1]-a[1]).map(([k,v])=>'<tr><td data-l="البند"><span class="n">'+k+'</span> '+acc(k).name+'</td><td data-l="المبلغ">'+sar(v)+'</td><td data-l="النسبة"><span class="n">'+Math.round(v/Math.max(1,rows.reduce((a,q)=>a+q.amount,0))*100)+'%</span></td></tr>').join('')+'</tbody></table></div>'})();
}

/* ---------- رسوم SVG بسيطة مع تلميح عند المرور ---------- */
function tipAttr(t){return ' data-tip="'+esc(t)+'"'}
function colChart(labels,series,h=230){ // أعمدة مجمعة تدعم السالب — محور واحد
  const W=640,H=h,pl=56,pr=10,pt=14,pb=28, all=series.flatMap(s=>s.v), mx=Math.max(0,...all), mn=Math.min(0,...all), rng=(mx-mn)||1;
  const Y=v=>pt+(mx-v)/rng*(H-pt-pb), gw=(W-pl-pr)/labels.length, bw=Math.min(18,(gw-10)/series.length);
  const ticks=[mn,mn/2,0,mx/2,mx].filter((v,i,a)=>a.indexOf(v)===i);
  let g=ticks.map(t=>'<line x1="'+pl+'" x2="'+(W-pr)+'" y1="'+Y(t)+'" y2="'+Y(t)+'" stroke="'+(t===0?'rgb(var(--wrgb) / .35)':'rgb(var(--wrgb) / .07)')+'"/><text x="'+(pl-6)+'" y="'+(Y(t)+4)+'" text-anchor="end" font-size="10" fill="#B0A7DA">'+M(t)+'</text>').join('');
  labels.forEach((l,i)=>{const cx=pl+gw*i+gw/2;
    series.forEach((s,j)=>{const v=s.v[i],x=cx-(series.length*bw+(series.length-1)*2)/2+j*(bw+2),y=Math.min(Y(v),Y(0)),hh=Math.max(1.5,Math.abs(Y(v)-Y(0)));
      g+='<rect x="'+x+'" y="'+y+'" width="'+bw+'" height="'+hh+'" rx="3" fill="'+s.c+'"'+tipAttr(l+' · '+s.n+': '+fmt(v)+' ر.س')+'/>'});
    g+='<text x="'+cx+'" y="'+(H-8)+'" text-anchor="middle" font-size="10.5" fill="#B0A7DA">'+l+'</text>'});
  return '<svg viewBox="0 0 '+W+' '+H+'" style="width:100%;height:auto;direction:ltr" font-family="IBM Plex Sans Arabic,sans-serif">'+g+'</svg>'+
    (series.length>1?'<div class="legend" style="margin-top:6px">'+series.map(s=>'<span><i style="background:'+s.c+'"></i>'+s.n+'</span>').join('')+'</div>':'');
}

function donut(parts,colors,size=150){const tot=parts.reduce((a,p)=>a+Math.max(0,p[1]),0)||1;let a=-Math.PI/2,r=size/2-12,cx=size/2,cy=size/2,g='';
  parts.forEach((p,i)=>{const v=Math.max(0,p[1]),da=v/tot*Math.PI*2;if(!v)return;const a2=a+da-0.03,l=da>Math.PI?1:0;
    g+='<path d="M'+(cx+r*Math.cos(a))+' '+(cy+r*Math.sin(a))+' A'+r+' '+r+' 0 '+l+' 1 '+(cx+r*Math.cos(a2))+' '+(cy+r*Math.sin(a2))+'" stroke="'+colors[i]+'" stroke-width="16" fill="none" stroke-linecap="round"'+tipAttr(p[0]+': '+fmt(p[1])+' ('+Math.round(v/tot*100)+'%)')+'/>';a+=da});
  return '<svg viewBox="0 0 '+size+' '+size+'" width="'+size+'" height="'+size+'">'+g+'</svg>'}

function smooth(P){if(P.length<2)return '';let d='M'+P[0][0].toFixed(1)+' '+P[0][1].toFixed(1);
  for(let i=0;i<P.length-1;i++){const p0=P[i-1]||P[i],p1=P[i],p2=P[i+1],p3=P[i+2]||p2,t=.14;

function niceTicks(mn,mx){const span=(mx-mn)||1,step0=span/4,mag=Math.pow(10,Math.floor(Math.log10(step0))),n=step0/mag,step=(n<=1?1:n<=2?2:n<=2.5?2.5:n<=5?5:10)*mag;
  const t=[],hi=Math.ceil(mx/step-1e-9)*step;for(let v=Math.floor(mn/step+1e-9)*step;v<=hi+step*.001;v+=step)t.push(+v.toFixed(6));return t}

/* أعمدة + خطوط مع تدرج لوني، حركة نمو، تمييز العمود عند المرور، وإخفاء السلاسل من المفتاح */

  // خطوط ومناطق
  series.forEach((s,j)=>{if(s.t!=='line')return;const P=s.v.map((v,i)=>[pl+gw*i+gw/2,Y(v)]),d=smooth(P);
    g+='<g data-s="'+j+'"><path class="ar" d="'+d+' L'+P[P.length-1][0]+' '+Y(0)+' L'+P[0][0]+' '+Y(0)+'Z" fill="url(#'+uid+'a'+j+')"/><path class="ln" pathLength="100" style="--L:100" d="'+d+'" stroke="'+s.c+'"/></g>'});

      const x=cx-(bars.length*bw+(bars.length-1)*4)/2+k*(bw+4);k++;const y0=Y(0),y1=Y(v),hh=Math.max(2,Math.abs(y1-y0)),top=Math.min(y0,y1),r=Math.min(6,bw/2,hh);
      const d=v>=0?'M'+x+' '+(top+hh)+'V'+(top+r)+'Q'+x+' '+top+' '+(x+r)+' '+top+'H'+(x+bw-r)+'Q'+(x+bw)+' '+top+' '+(x+bw)+' '+(top+r)+'V'+(top+hh)+'Z'
                  :'M'+x+' '+top+'V'+(top+hh-r)+'Q'+x+' '+(top+hh)+' '+(x+r)+' '+(top+hh)+'H'+(x+bw-r)+'Q'+(x+bw)+' '+(top+hh)+' '+(x+bw)+' '+(top+hh-r)+'V'+top+'Z';

    g+='<text class="ax" x="'+cx+'" y="'+(H-9)+'" text-anchor="middle">'+l+'</text></g>'});

  parts.forEach((p,i)=>{const v=Math.max(0,p[1]);if(!v)return;const len=v/tot*C,gap=parts.length>1?Math.min(6,len*.3):0;

function collectSheets(){
  const sheets=[], r=route();
  const docs=[document];
  if(r.a==='reports'){try{docs[0]=$('#finFrame').contentDocument}catch(e){}}
  const root=r.a==='reports'?docs[0].body:$('#view');
  if(r.a!=='reports'&&LASTLIST&&LASTLIST.hash===location.hash){
    const {key,o}=LASTLIST, st=UI[key]||{};let rows=o.rows.slice();
    if(st.f){const f=o.filters.find(x=>x[0]===st.f);if(f)rows=rows.filter(f[2])}
    if(st.q){rows=rows.filter(x=>o.text(x).includes(st.q.trim()))}
    sheets.push([String(o.title).slice(0,28),[o.cols.map(c=>c[0])].concat(rows.map(x=>o.cols.map(c=>numish(txt(c[1](x))))))]);
  }
  const kp=[...root.querySelectorAll('.kpi,.kpi-card,.stat')].map(k=>{const l=k.querySelector('small,.l,.lbl');const v=k.querySelector('b,.v,.val');return l&&v?[l.textContent.trim(),numish(v.textContent.replace(/\s+/g,' ').trim())]:null}).filter(Boolean);
  if(kp.length)sheets.push(['المؤشرات',[['المؤشر','القيمة']].concat(kp)]);
  [...root.querySelectorAll('table')].forEach((t,i)=>{if(sheets.length&&LASTLIST&&LASTLIST.hash===location.hash&&t.closest('.tbl.rsp')&&i===0&&r.a!=='reports')return;
    const rows=[...t.rows].map(tr=>[...tr.cells].map(td=>numish(td.textContent.replace(/\s+/g,' ').trim())));if(rows.length<2)return;
    let nm=(t.closest('.card,.sheet,section,div')?.querySelector('h4,h3,h2')?.textContent||'جدول '+(i+1)).trim().replace(/[\\\/\?\*\[\]:]/g,'').slice(0,28);
    while(sheets.some(s=>s[0]===nm))nm=nm.slice(0,25)+' '+(i+1);sheets.push([nm,rows])});
  return sheets;
}
async function exportExcel(){
  $$('.drop').forEach(x=>x.classList.remove('open'));

  try{await loadXLSX();const wb=XLSX.utils.book_new();wb.Workbook={Views:[{RTL:true}]};
    sheets.forEach(([n,a])=>{const ws=XLSX.utils.aoa_to_sheet(a);ws['!cols']=a[0].map((_,i)=>({wch:Math.min(48,Math.max(10,...a.map(r=>String(r[i]??'').length+2)))}));XLSX.utils.book_append_sheet(wb,ws,n||'Sheet')});

  }catch(e){const csv='\ufeff'+sheets.map(([n,a])=>n+'\n'+a.map(r=>r.map(v=>'"'+String(v??'').replace(/"/g,'""')+'"').join(',')).join('\n')).join('\n\n');const b=new Blob([csv],{type:'text/csv;charset=utf-8'});const l=document.createElement('a');l.href=URL.createObjectURL(b);l.download=fn+'.csv';l.click();toast('تم التصدير CSV (يفتح في Excel)')}
}

  S.requests.filter(q=>q.status==='wait'&&chainOf(q)[q.step]===r).forEach(q=>{const age=Math.max(0,-days(q.date));out.push({k:'req',id:q.id,t:'طلب مالي',title:q.desc,sub:DEPTS[q.dept]+' · '+q.acc+' '+acc(q.acc).name,amt:q.amount,age,go:'requests/view/'+q.id,bulk:true})});
  S.projects.filter(p=>(p.quote.status==='wait_cfo'&&r==='cfo')||(p.quote.status==='wait_ceo'&&r==='ceo')).forEach(p=>{const d=(p.log[0]||[])[2]||'2026-09-30';out.push({k:'quote',id:p.quote.no,t:'عرض سعر',title:p.name,sub:partner(p.customer).name+' · هامش '+p.quote.margin+'%',amt:quoteTotal(p),age:Math.max(0,-days(d)),go:'projects/view/'+p.id+'/quote',warn:p.quote.margin<20?'هامش أقل من 20%':''})});
  if(r==='cfo')S.custody.filter(c=>['review','requested'].includes(c.status)).forEach(c=>{const d=(c.log[0]||[])[2]||'2026-09-30';out.push({k:'cu',id:c.id,t:c.status==='review'?'تصفية عهدة':'صرف عهدة',title:project(c.project).name,sub:c.lines.length+' بنود',amt:c.amount,age:Math.max(0,-days(d)),go:'requests/cu/'+c.id})});
  if(r==='sales')S.projects.filter(p=>p.quote.status==='approved').forEach(p=>out.push({k:'send',id:p.quote.no,t:'جاهز للإرسال',title:p.name,sub:partner(p.customer).name,amt:quoteTotal(p),age:0,go:'projects/view/'+p.id+'/quote'}));
  if(r==='hr')S.leaves.filter(l=>l.st==='wait').forEach(l=>out.push({k:'leave',id:l.who,t:'إجازة',title:l.who+' — '+l.type,sub:l.days+' أيام من '+l.from,amt:0,age:1,go:'hr/leaves'}));
  if(['pm','sales','pur','hr'].includes(r)){const dept=Object.entries(S.managers).find(([d,x])=>x===r)?.[0];S.requests.filter(q=>q.dept===dept&&q.status==='rejected'&&-days(q.date)<30).forEach(q=>out.push({k:'rej',id:q.id,t:'طلب مرفوض يحتاج تعديل',title:q.desc,sub:'السبب: '+(q.reason||''),amt:q.amount,age:-days(q.date),go:'requests/view/'+q.id}))}
  out.forEach(x=>{x.score=Math.round(Math.min(40,x.amt/2500)+Math.min(35,x.age*7)+(x.age>3?15:0)+(x.warn?10:0)+(x.k==='quote'?8:0));x.pri=x.score>=55?'عاجل':x.score>=30?'مهم':'عادي'});
  return out.sort((a,b)=>b.score-a.score);
}

  $('#gsR').innerHTML=G.length?G.map(([g,a])=>'<div class="gg">'+g+'</div>'+a.map(x=>'<a class="gi" onclick="searchClose();go(\''+x[2]+'\')"><b>'+esc(x[0])+'</b><small>'+esc(x[1])+'</small></a>').join('')).join(''):'<div class="empty">لا نتائج</div>'}

const _reqForm=reqForm;
reqForm=function(id){const h=_reqForm(id);const q=S.requests.find(x=>x.id===id);if(!q||!h.includes('<div class="split">'))return h;
  const same=S.requests.filter(x=>x.id!==q.id&&x.dept===q.dept&&x.acc===q.acc);const avg=same.length?same.reduce((a,x)=>a+x.amount,0)/same.length:0;
  const dup=S.requests.filter(x=>x.id!==q.id&&x.dept===q.dept&&x.amount===q.amount&&Math.abs(days(x.date)-days(q.date))<=30);
  const p=q.project?project(q.project):null;const age=-days(q.date);
  const L=[];
  if(avg)L.push((q.amount>avg*1.5?'⚠️ ':'✓ ')+'المبلغ '+(q.amount>avg?'أعلى':'أقل')+' من متوسط هذا البند لإدارة '+DEPTS[q.dept]+' ('+fmt(avg)+' ر.س) بنسبة '+Math.round(Math.abs(q.amount/avg-1)*100)+'%');
  if(dup.length)L.push('⚠️ طلب مشابه بنفس المبلغ خلال 30 يوماً: '+dup.map(x=>x.id).join('، '));
  if(q.qr===false)L.push('⚠️ الفاتورة بدون رمز QR — غير مطابقة لسياسة الفوترة الإلكترونية');
  if(q.vatMismatch)L.push('⚠️ الرقم الضريبي في الفاتورة لا يطابق المورد المسجل');
  if(q.time&&q.time>'15:00')L.push('ℹ️ رُفع بعد 3:00 م ('+q.time+') — يُحتسب من اليوم التالي');
  if(p){const ct=costTotal(p);L.push((p.actual+q.amount>ct?'⚠️ ':'✓ ')+'أثر على ميزانية '+p.name+': '+Math.round((p.actual+q.amount)/Math.max(1,ct)*100)+'% من الكوست شيت بعد الصرف')}
  if(q.status==='wait')L.push((age>3?'⚠️ ':'✓ ')+'ينتظر منذ '+age+' يوم'+(age>3?' — تجاوز مدة الخدمة (3 أيام عمل)':''));
  const risk=L.filter(x=>x.startsWith('⚠️')).length;
  const card='<div class="card aisum" style="margin-bottom:14px"><div style="display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:8px"><b>✦ ملخص مساعد أورس</b>'+pill(risk?'wait':'ok',risk?risk+' ملاحظات تحتاج انتباه':'لا ملاحظات — جاهز للاعتماد')+'</div><ul style="margin:0;padding-inline-start:18px;line-height:1.9;font-size:13px">'+L.map(x=>'<li>'+esc(x)+'</li>').join('')+'</ul></div>';
  return h.replace('<div class="split">',card+'<div class="split">')};

let FSC=1;
function forecastData(sc){
  const W=13, open=FIN.cash, inflow=Array(W).fill(0), outflow=Array(W).fill(0);
  const col=[[0,[.35,.3,.2,.1]],[1,[0,.15,.2,.2,.1]],[2,[0,0,.1,.15,.15,.1]],[3,[0,0,0,.05,.05,.05,.05,.05]]];
  col.forEach(([b,w])=>w.forEach((p,i)=>inflow[i]+=FIN.arAging[b][1]*p*(sc===0?.75:sc===2?1.15:1)));
  S.projects.filter(p=>p.stage===4).forEach(p=>{const rem=quoteTotal(p)*1.15*(1-p.progress/100)*.5;const wk=Math.min(W-1,Math.max(2,Math.round(days(p.end)/7)));inflow[wk]+=rem*(sc===0?.7:1)});
  S.requests.filter(q=>q.status==='je').forEach(q=>outflow[0]+=q.amount);
  S.requests.filter(q=>q.status==='wait').forEach(q=>outflow[1]+=q.amount*.85);
  [3,7,11].forEach(w=>outflow[w]+=FIN.hr.monthly);
  for(let i=0;i<12;i++)outflow[i]+=FIN.ap*.6/12*(sc===2?.85:1);
  const fixedW=Math.max(20000,(FIN.burn-FIN.hr.monthly)/4.33*.6);for(let i=0;i<W;i++)outflow[i]+=fixedW;
  let bal=open;const close=[],low=[];for(let i=0;i<W;i++){bal+=inflow[i]-outflow[i];close.push(Math.round(bal))}
  return {inflow:inflow.map(Math.round),outflow:outflow.map(Math.round),close,first:close.findIndex(v=>v<0),min:Math.min(...close)};
}

}
function auditFlags(){
  const F=[];const R=S.requests;
  R.forEach(q=>{const d=R.filter(x=>x.id<q.id&&x.dept===q.dept&&x.amount===q.amount&&Math.abs(days(x.date)-days(q.date))<=30);if(d.length)F.push({lv:'bad',k:'تكرار محتمل',t:q.id+' يطابق '+d.map(x=>x.id).join('، ')+' (نفس الإدارة والمبلغ خلال 30 يوماً)',go:'requests/view/'+q.id,amt:q.amount})});
  const by={};R.filter(q=>q.status!=='rejected').forEach(q=>{const k=q.dept+'|'+q.acc;(by[k]=by[k]||[]).push(q)});
  Object.values(by).forEach(list=>{list.sort((a,b)=>a.date<b.date?-1:1);for(let i=0;i<list.length;i++){const grp=list.filter(x=>Math.abs(days(x.date)-days(list[i].date))<=3);const lim=S.chain[list[i].dept]??10000;if(grp.length>1&&grp.every(x=>x.amount<=lim)&&grp.reduce((a,x)=>a+x.amount,0)>lim){const ids=grp.map(x=>x.id).sort().join('،');if(!F.some(f=>f.ids===ids))F.push({lv:'warn',k:'تجزئة لتفادي السقف',ids,t:'طلبات '+ids+' على نفس البند خلال 3 أيام، كل واحد تحت السقف ومجموعها '+fmt(grp.reduce((a,x)=>a+x.amount,0))+' ر.س',go:'requests/view/'+grp[0].id,amt:grp.reduce((a,x)=>a+x.amount,0)});}}});
  R.filter(q=>q.qr===false).forEach(q=>F.push({lv:'bad',k:'فاتورة بدون QR',t:q.id+' — '+q.desc,go:'requests/view/'+q.id,amt:q.amount}));
  R.filter(q=>q.vatMismatch).forEach(q=>F.push({lv:'bad',k:'رقم ضريبي غير مطابق',t:q.id+' — الرقم في الفاتورة يختلف عن المورد المسجل',go:'requests/view/'+q.id,amt:q.amount}));
  R.filter(q=>q.time&&q.time>'15:00').forEach(q=>F.push({lv:'info',k:'بعد 3:00 مساءً',t:q.id+' رُفع '+q.time+' — يُحتسب من اليوم التالي',go:'requests/view/'+q.id,amt:q.amount}));
  R.filter(q=>q.amount>=10000&&q.amount%1000===0&&q.status!=='rejected').forEach(q=>F.push({lv:'info',k:'مبلغ مدوّر',t:q.id+' — '+fmt(q.amount)+' ر.س (تأكد من الفاتورة التفصيلية)',go:'requests/view/'+q.id,amt:q.amount}));
  S.partners.filter(p=>p.type==='vendor'&&days(p.exp.cr)<=30).forEach(p=>F.push({lv:'warn',k:'مورد سجله ينتهي',t:p.name+' — '+days(p.exp.cr)+' يوم',go:'purchases/partner/'+p.id,amt:0}));
  S.custody.filter(c=>c.status==='open'&&days(c.due)<7).forEach(c=>F.push({lv:'warn',k:'عهدة قرب موعد التصفية',t:c.id+' — '+project(c.project).name+' (باقي '+days(c.due)+' يوم)',go:'requests/cu/'+c.id,amt:c.amount}));
  return F;
}

aiAnswer=function(q){const n=norm(q);const nav=[[/جدول الدفع/,'smart/payrun','جدول الدفعات'],[/ضمان|كفال/,'smart/lg','الضمانات البنكية'],[/اقرار|ضريبه القيمه|الزكاه/,'smart/vat','الإقرار الضريبي'],[/الشقيقه|عمق|وصاد/,'smart/group','الشركات الشقيقة'],[/قرارات|غرفه القرار/,'ceo/decisions','غرفة القرارات'],[/اهداف|okr/,'ceo/okr','أهداف الربع'],[/قارن المشاريع|مقارنه المشاريع/,'ceo/pcompare','مقارنة المشاريع'],[/تقويم|الموارد المحجوزه|تعارض/,'projects/resources','تقويم الموارد'],[/دروس/,'projects/lessons','الدروس المستفادة'],[/فرص|خط المبيعات/,'sales/pipeline','خط الفرص'],[/خساره|خسرنا/,'sales/lost','تحليل الخسارة'],[/تقييم الموردين/,'purchases/ratings','تقييم الموردين'],[/معتمدين|المعتمده/,'purchases/approved','الموردون المعتمدون'],[/مجمع|تجميع/,'purchases/bundle','الشراء المجمّع'],[/تقييم الاداء|اداء الموظفين/,'hr/perf','تقييم الأداء'],[/نهايه الخدمه/,'hr/eos','نهاية الخدمة'],[/موظف جديد|تعيين جديد/,'hr/onboard','الموظف الجديد'],[/تصميم|تصاميم/,'design','التصاميم'],[/دعم فني|تذكره|عطل|الطابعه/,'it','الدعم الفني'],[/تراخيص|اجهزه|اشتراكات/,'it/assets','الأجهزة والتراخيص'],[/ميداني|الموقع/,'field','الوضع الميداني'],[/شاشه المكتب|عرض المكتب/,'wall','شاشة المكتب']];
  for(const [re,h,t] of nav)if(re.test(n)&&!/طلب مالي|عهده/.test(n)){const a=h.split('/')[0];if(!has(can.app[a]||[])||(h.includes('/')&&!menuAllowed(a,h.split('/')[1])))return aiBot('ما عندك صلاحية على «'+t+'».');go(h);return aiBot('فتحت «'+t+'».')}

function liveKey(x){if(x&&typeof x==='object'){if(!Array.isArray(x)){if(x.id!=null)return 'i:'+x.id;if(x.no!=null)return 'n:'+x.no;if(x.key!=null)return 'k:'+x.key}else if(typeof x[0]==='string'||typeof x[0]==='number')return 'a:'+x[0]+'|'+(typeof x[1]==='string'||typeof x[1]==='number'?x[1]:'')}return 'j:'+JSON.stringify(x)}
function liveMerge(b,l,r){const J=JSON.stringify;
  if(J(l)===J(b))return r; if(J(r)===J(b))return l; if(J(l)===J(r))return l;
  if(Array.isArray(l)&&Array.isArray(r)){
    const B=new Map(),L=new Map(),R=new Map();(Array.isArray(b)?b:[]).forEach(x=>B.set(liveKey(x),x));l.forEach(x=>L.set(liveKey(x),x));r.forEach(x=>R.set(liveKey(x),x));
    const head=[],tail=[],out=[];let old=false;
    l.forEach(x=>{const k=liveKey(x);if(B.has(k)){old=true;return}
      if(R.has(k)){if(J(R.get(k))===J(x))return; if(x&&typeof x==='object'&&!Array.isArray(x)&&x.id!=null)x=Object.assign({},x,{id:x.id+'-'+Math.random().toString(36).slice(2,4).toUpperCase()});else return}
      (old?tail:head).push(x)});
    r.forEach(x=>{const k=liveKey(x);if(!B.has(k)){out.push(x);return}
      const bx=B.get(k);if(!L.has(k)){if(J(bx)!==J(x))out.push(x);return}
      const lx=L.get(k);if(J(lx)===J(bx)){out.push(x);return}if(J(x)===J(bx)){out.push(lx);return}
      out.push(lx&&x&&typeof lx==='object'&&typeof x==='object'&&!Array.isArray(lx)?liveMerge(bx,lx,x):lx)});
    return head.concat(out,tail)}
  if(l&&r&&typeof l==='object'&&typeof r==='object'&&!Array.isArray(l)&&!Array.isArray(r)){
    const bb=b&&typeof b==='object'&&!Array.isArray(b)?b:{},o={};
    new Set([...Object.keys(r),...Object.keys(l),...Object.keys(bb)]).forEach(q=>{const v=liveMerge(bb[q],l[q],r[q]);if(v!==undefined)o[q]=v});return o}
  return l}

async function liveSave(k,s,tries){const b=LIVE.base[k]||{s:'null',ver:0};
  const {data,error}=await LIVE.sb.rpc('orris_save_doc',{p_id:k,p_data:JSON.parse(s),p_base:b.ver});
  if(error)throw error;

  const remote=data.data;let merged;
  if(k==='SEQ'){merged=Object.assign({},remote);Object.keys(SEQ).forEach(q=>merged[q]=Math.max(+SEQ[q]||0,+remote[q]||0))}

  liveReplace(k,merged);LIVE.base[k]={s:JSON.stringify(remote),ver:data.ver};
